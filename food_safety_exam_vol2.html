<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コストコ フードセーフティー 模擬試験 Level 2 — Vol.2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Oswald:wght@400;600;700&display=swap');

  :root {
    --bg: #0C0F14;
    --card: #141922;
    --border: #232c3a;
    --blue: #005DAA;
    --accent: #00A8E8;
    --gold: #F0B429;
    --text: #EDF2F7;
    --muted: #7A8899;
    --correct: #38A169;
    --wrong: #E53E3E;
    --selected: #2B6CB0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; min-height: 100vh; }

  #header {
    background: linear-gradient(135deg, #003b6e 0%, #005DAA 100%);
    padding: 14px 28px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 3px 20px rgba(0,0,0,0.5);
    border-bottom: 2px solid var(--accent);
  }
  #header h1 { font-family: 'Oswald', sans-serif; font-size: 1.5rem; letter-spacing: 3px; color: #fff; }
  .hd-sub { font-size: 0.65rem; color: rgba(255,255,255,0.7); letter-spacing: 2px; margin-bottom: 2px; }
  .vol-badge {
    background: var(--gold); color: #000;
    font-family: 'Oswald', sans-serif;
    font-size: 0.75rem; font-weight: 700;
    padding: 3px 10px; border-radius: 4px; letter-spacing: 2px;
    margin-left: 12px; vertical-align: middle;
  }
  #progress-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  #progress-text { font-size: 0.78rem; color: rgba(255,255,255,0.85); }
  #progress-bar-outer { width: 180px; height: 5px; background: rgba(255,255,255,0.25); border-radius: 3px; overflow: hidden; }
  #progress-bar-inner { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; transition: width 0.4s; }

  /* START */
  #start-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 90vh; padding: 40px 20px; text-align: center;
  }
  .vol-label { font-family: 'Oswald', sans-serif; font-size: 0.8rem; letter-spacing: 5px; color: var(--accent); margin-bottom: 12px; }
  .big-title { font-family: 'Oswald', sans-serif; font-size: clamp(2.5rem,7vw,4.5rem); color: #fff; letter-spacing: 3px; line-height: 1.1; margin-bottom: 6px; }
  .big-title span { color: var(--accent); }
  .big-sub { font-size: 0.85rem; color: var(--muted); letter-spacing: 2px; margin-bottom: 40px; }
  .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 500px; margin-bottom: 40px; }
  .info-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .info-card .num { font-family: 'Oswald', sans-serif; font-size: 2.2rem; color: var(--accent); line-height: 1; }
  .info-card .label { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }
  .start-btn {
    background: var(--blue); color: #fff; border: none;
    padding: 16px 56px; font-size: 1rem; font-family: 'Noto Sans JP', sans-serif; font-weight: 700;
    border-radius: 8px; cursor: pointer; letter-spacing: 2px;
    transition: all 0.15s; box-shadow: 0 4px 20px rgba(0,93,170,0.5);
    border: 1px solid var(--accent);
  }
  .start-btn:hover { background: #0073d1; transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,93,170,0.6); }

  /* QUIZ */
  #quiz-screen { display: none; padding: 28px 20px; max-width: 820px; margin: 0 auto; }
  .q-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .q-num { font-family: 'Oswald', sans-serif; font-size: 1rem; color: var(--gold); letter-spacing: 2px; }
  .q-category { font-size: 0.68rem; background: var(--border); color: var(--muted); padding: 4px 12px; border-radius: 20px; letter-spacing: 1px; }
  .q-text {
    font-size: 1rem; line-height: 1.85; font-weight: 500; margin-bottom: 24px;
    padding: 22px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; border-left: 4px solid var(--accent);
  }
  .options { display: flex; flex-direction: column; gap: 11px; }
  .option {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 10px;
    padding: 15px 18px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    font-size: 0.93rem; line-height: 1.65;
  }
  .option:hover:not(.disabled) { border-color: #445566; background: #181f2a; transform: translateX(4px); }
  .opt-letter {
    min-width: 27px; height: 27px; background: var(--border); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 700; color: var(--muted); flex-shrink: 0;
    transition: background 0.15s, color 0.15s; margin-top: 1px;
  }
  .option.selected { border-color: var(--selected); background: rgba(43,108,176,0.18); }
  .option.selected .opt-letter { background: var(--selected); color: #fff; }
  .option.correct { border-color: var(--correct); background: rgba(56,161,105,0.1); }
  .option.correct .opt-letter { background: var(--correct); color: #fff; }
  .option.wrong { border-color: var(--wrong); background: rgba(229,62,62,0.1); }
  .option.wrong .opt-letter { background: var(--wrong); color: #fff; }
  .option.disabled { cursor: default; }

  .explanation {
    display: none; margin-top: 18px; padding: 18px 20px;
    background: #0b1e14; border: 1px solid var(--correct);
    border-radius: 10px; font-size: 0.88rem; line-height: 1.85; color: #c6e9d5;
  }
  .explanation.wrong-exp { background: #1e0b0b; border-color: var(--wrong); color: #f0c6c6; }
  .explanation .exp-title { font-weight: 700; margin-bottom: 8px; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; }

  .nav-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 26px; }
  .nav-btn { padding: 11px 28px; border: none; border-radius: 8px; font-family: 'Noto Sans JP', sans-serif; font-size: 0.9rem; font-weight: 700; cursor: pointer; letter-spacing: 1px; transition: all 0.15s; }
  .nav-btn.primary { background: var(--blue); color: #fff; border: 1px solid var(--accent); }
  .nav-btn.primary:hover { background: #0073d1; }
  .nav-btn.secondary { background: var(--border); color: var(--text); }
  .nav-btn.secondary:hover { background: #2e3c4e; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* RESULT */
  #result-screen { display: none; padding: 50px 20px; max-width: 680px; margin: 0 auto; text-align: center; }
  .score-ring { width: 190px; height: 190px; margin: 0 auto 28px; position: relative; }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring .score-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
  .score-pct { font-family: 'Oswald', sans-serif; font-size: 2.8rem; line-height: 1; color: var(--text); }
  .score-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 1px; }
  .result-title { font-family: 'Oswald', sans-serif; font-size: 2.2rem; letter-spacing: 3px; margin-bottom: 8px; }
  .result-msg { color: var(--muted); margin-bottom: 28px; line-height: 1.8; white-space: pre-line; }
  .result-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 36px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .stat-card .snum { font-family: 'Oswald', sans-serif; font-size: 1.9rem; line-height: 1; }
  .stat-card .slabel { font-size: 0.68rem; color: var(--muted); margin-top: 4px; }
  .retry-btn { background: var(--blue); color: #fff; border: 1px solid var(--accent); padding: 14px 44px; font-size: 0.95rem; font-weight: 700; border-radius: 8px; cursor: pointer; letter-spacing: 2px; transition: all 0.15s; margin: 8px; }
  .retry-btn:hover { background: #0073d1; }
  .review-section { text-align: left; margin-top: 44px; }
  .review-title { font-family: 'Oswald', sans-serif; font-size: 1.4rem; letter-spacing: 2px; color: var(--gold); margin-bottom: 18px; }
  .review-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 10px; }
  .review-item.r-wrong { border-color: rgba(229,62,62,0.35); }
  .review-item.r-correct { border-color: rgba(56,161,105,0.2); }
  .review-q { font-size: 0.88rem; margin-bottom: 10px; line-height: 1.6; }
  .ra-label { color: var(--muted); font-size: 0.72rem; margin-bottom: 3px; }
  .ra-correct { color: var(--correct); font-weight: 500; }
  .ra-wrong { color: var(--wrong); }
</style>
</head>
<body>

<div id="header">
  <div>
    <div class="hd-sub">COSTCO WHOLESALE JAPAN</div>
    <h1>FOOD SAFETY EXAM <span class="vol-badge">VOL.2</span></h1>
  </div>
  <div id="progress-wrap">
    <span id="progress-text">0 / 100</span>
    <div id="progress-bar-outer"><div id="progress-bar-inner"></div></div>
  </div>
</div>

<div id="start-screen">
  <div class="vol-label">VOLUME 2 — NEW 100 QUESTIONS</div>
  <div class="big-title">模擬試験<br><span>第2弾</span></div>
  <div class="big-sub">Food Safety Training Level 2 / 一般衛生管理プログラム</div>
  <div class="info-grid">
    <div class="info-card"><div class="num">100</div><div class="label">問題数</div></div>
    <div class="info-card"><div class="num">4-5</div><div class="label">択問題</div></div>
    <div class="info-card"><div class="num">85</div><div class="label">合格点</div></div>
  </div>
  <button class="start-btn" onclick="startExam()">試験開始</button>
</div>

<div id="quiz-screen">
  <div class="q-meta">
    <span class="q-num" id="q-num-label">問題 1 / 100</span>
    <span class="q-category" id="q-category"></span>
  </div>
  <div class="q-text" id="q-text"></div>
  <div class="options" id="options-container"></div>
  <div class="explanation" id="explanation"></div>
  <div class="nav-row">
    <button class="nav-btn secondary" id="prev-btn" onclick="prevQ()">◀ 前へ</button>
    <button class="nav-btn primary" id="next-btn" onclick="nextQ()">次へ ▶</button>
    <button class="nav-btn primary" id="submit-btn" onclick="submitExam()" style="display:none">結果を見る</button>
  </div>
</div>

<div id="result-screen">
  <div class="score-ring">
    <svg width="190" height="190" viewBox="0 0 190 190">
      <circle cx="95" cy="95" r="80" fill="none" stroke="#232c3a" stroke-width="13"/>
      <circle id="score-arc" cx="95" cy="95" r="80" fill="none" stroke="#005DAA" stroke-width="13"
        stroke-linecap="round" stroke-dasharray="503" stroke-dashoffset="503"/>
    </svg>
    <div class="score-text">
      <div class="score-pct" id="score-pct">0</div>
      <div class="score-label">点</div>
    </div>
  </div>
  <div class="result-title" id="result-title">—</div>
  <div class="result-msg" id="result-msg"></div>
  <div class="result-stats">
    <div class="stat-card"><div class="snum" id="r-correct" style="color:var(--correct)">0</div><div class="slabel">正解</div></div>
    <div class="stat-card"><div class="snum" id="r-wrong" style="color:var(--wrong)">0</div><div class="slabel">不正解</div></div>
    <div class="stat-card"><div class="snum" id="r-unanswered" style="color:var(--gold)">0</div><div class="slabel">未回答</div></div>
  </div>
  <button class="retry-btn" onclick="retryExam()">もう一度挑戦</button>
  <button class="retry-btn" style="background:var(--border);color:var(--text);border-color:var(--border)" onclick="showReview()">間違いを確認</button>
  <div class="review-section" id="review-section" style="display:none"></div>
</div>

<script>
const ALL_QUESTIONS = [

  // ===== 食品安全の基本・管理監督者 =====
  {cat:"食品安全の基本", q:"FDA制定の「食品基準」における管理監督者の定義として正しいものはどれか？",
   opts:["食品安全資格を持つすべての従業員","食品施設の経営者","食品施設に常駐し、検査時点の運営に責任のある個人","保健所の担当職員"],
   ans:2, exp:"FDA制定の食品基準では管理監督者を「食品施設に常駐し、検査時点の運営に責任のある個人」と定義しています。"},

  {cat:"食品安全の基本", q:"管理監督者が従業員に認識させなければならない事項に含まれないものはどれか？",
   opts:["他の店舗の売上データ","自分のどういった行動が食中毒の危険へと陥れるのか","製造現場で何をしなければならないのか","なぜその作業工程が必要なのか"],
   ans:0, exp:"他店舗の売上データは食品安全上の認識事項ではありません。"},

  {cat:"食品安全の基本", q:"このトレーニングの認定を受けた機関として正しいものはどれか？",
   opts:["EFSA（欧州食品安全機関）","FDA（米国食品医薬品局）","WHO（世界保健機関）","NEHA（米国環境保健協会）"],
   ans:3, exp:"このトレーニングはNEHA（National Environmental Health Association / 米国環境保健協会）の認定を受けた資料に厚生労働省の指針を加味したものです。"},

  {cat:"食品安全の基本", q:"食品安全トレーニングLevel 2の内容として含まれないものはどれか？",
   opts:["食品安全上の危害","コストコの基本的なオペレーション","HACCPの内容","店舗の人事評価制度"],
   ans:3, exp:"Level 2の内容はコストコの基本的なオペレーション・食品安全上の危害・HACCPなどです。人事評価制度は含まれません。"},

  {cat:"食品安全の基本", q:"デイリーインスペクションプログラムの実施について正しいものはどれか？",
   opts:["Food Safety Training Level 2に合格している管理職以上の職位の者が行う","Food Safety Training Level 1に合格していれば可能","誰でも実施できる","フードセーフティー部門のみが実施する"],
   ans:0, exp:"デイリーインスペクションはNEHA Food Safety Training Level 2に合格している管理職以上の職位の者が行います。"},

  {cat:"食品安全の基本", q:"デイリーインスペクションは製造作業終了の何時間以上前に完了しなければならないか？",
   opts:["30分以上前","2時間以上前","3時間以上前","1時間以上前"],
   ans:3, exp:"デイリーインスペクションは製造作業が終了する1時間以上前に完了しなければなりません。"},

  // ===== 危害の分類・汚染 =====
  {cat:"危害の種類", q:"食中毒の大部分を占める危害の種類はどれか？",
   opts:["生物的危害","複合的危害","化学的危害","物理的危害"],
   ans:0, exp:"食中毒の大部分は生物的危害（主に細菌）に起因します。"},

  {cat:"危害の種類", q:"生物的危害に分類されるものの組み合わせとして正しいものはどれか？",
   opts:["細菌・カビ・農薬","農薬・金属・細菌","ウイルス・化学物質・寄生虫","細菌・ウイルス・寄生虫"],
   ans:3, exp:"生物的危害は細菌（バクテリア）・ウイルス・寄生虫の3つに分類されます。"},

  {cat:"危害の種類", q:"物理的危害の除去に「個人衛生の向上」が有効な異物はどれか？",
   opts:["金属片","石","毛髪","ガラス片"],
   ans:2, exp:"毛髪は軟質異物に分類され、個人衛生の向上（ヘアネット着用など）が主な除去方法です。"},

  {cat:"危害の種類", q:"食品の製造工程における汚染リスクとして正しい説明はどれか？",
   opts:["加工段階のみ汚染リスクがある","小売段階では汚染リスクはない","生育・屠殺・収穫・加工・包装・配送・陳列など全工程にリスクが存在する","消費者が調理する段階のみリスクがある"],
   ans:2, exp:"生育・飼育・屠殺・収穫・下処理・加熱調理・包装・配送・陳列・提供販売など全工程に危害リスクが存在します。"},

  // ===== 細菌の特性 =====
  {cat:"生物的危害（細菌）", q:"有益なバクテリアの例として正しいものはどれか？",
   opts:["ビフィズス菌（ヨーグルト・チーズに使用）","カンピロバクター菌","腸管出血性大腸菌O-157","サルモネラ菌"],
   ans:0, exp:"ビフィズス菌はヨーグルトやチーズの製造に使われる有益なバクテリアです。"},

  {cat:"生物的危害（細菌）", q:"腐敗性バクテリアの働きとして正しいものはどれか？",
   opts:["人体に有益に働く","食品を喫食できない状態にし腐敗させる","食中毒を引き起こす","食品を保存する"],
   ans:1, exp:"腐敗性バクテリア（シュウドモナス・マイクロコッカスなど）は食品を喫食できない状態にし腐敗させます。"},

  {cat:"生物的危害（細菌）", q:"FATTOMのうち「A」が指すものはどれか？",
   opts:["アレルゲン（Allergen）","アミノ酸（Amino acid）","酸性度（Acidity Level）","空気（Air）"],
   ans:2, exp:"FATTOMのAはAcidity Level（酸性度）です。Food・Acidity・Time・Temperature・Oxygen・Moistureの頭文字です。"},

  {cat:"生物的危害（細菌）", q:"好気性細菌・嫌気性細菌・通性嫌気性細菌の説明として正しいものはどれか？",
   opts:["通性嫌気性細菌は酸素の有無に関わらず増殖できる","嫌気性細菌は増殖に酸素を必要とする","好気性細菌は酸素がない環境でのみ増殖できる","偏性嫌気性細菌は酸素があっても増殖できる"],
   ans:0, exp:"通性嫌気性細菌は酸素の有無に関わらず増殖できます。好気性細菌は酸素を必要とし、偏性嫌気性細菌は酸素がない環境でのみ生育できます。"},

  {cat:"生物的危害（細菌）", q:"芽胞を形成するバクテリアの組み合わせとして正しいものはどれか？",
   opts:["サルモネラ属菌・ボツリヌス菌・ノロウイルス","腸炎ビブリオ菌・黄色ブドウ球菌・E.coli O-157","カンピロバクター菌・サルモネラ属菌・リステリア菌","ボツリヌス菌・セレウス菌・ウェルシュ菌"],
   ans:3, exp:"芽胞を形成するバクテリアはボツリヌス菌（偏性嫌気性）・セレウス菌（通性嫌気性）・ウェルシュ菌（偏性嫌気性）です。"},

  {cat:"生物的危害（細菌）", q:"ウェルシュ菌の主なPHFと症状として正しいものはどれか？",
   opts:["生の魚介類・腹痛・嘔吐（2〜48時間）","加熱不十分な鶏肉・腹痛・下痢（6〜18時間）","ハム・乳製品・吐き気・嘔吐（1〜6時間）","はちみつ・視覚異常・呼吸困難（12〜36時間）"],
   ans:1, exp:"ウェルシュ菌は食肉・魚介類が主なPHFで、6〜18時間の潜伏期間後に腹痛・下痢を引き起こします。"},

  {cat:"生物的危害（細菌）", q:"セレウス菌の特徴として正しいものはどれか？",
   opts:["感染型・好塩性・芽胞を形成しない","生体内毒素型・二次感染が起きやすい","感染型・偏性嫌気性・潜伏時間12〜36時間","毒素型・通性嫌気性・芽胞形成・耐塩性あり"],
   ans:3, exp:"セレウス菌は毒素型・通性嫌気性・芽胞形成・耐塩性があります。焼きめしやパスタが主なPHFです。"},

  {cat:"生物的危害（細菌）", q:"腸炎ビブリオ菌の特徴として正しいものはどれか？",
   opts:["偏性嫌気性で芽胞を形成する","耐乾性があり牛肉が主なPHF","毒素型で潜伏時間は1〜6時間","好塩性で魚介類が主なPHF"],
   ans:3, exp:"腸炎ビブリオ菌は感染型・通性嫌気性・好塩性（塩分を好む）で、魚介類が主なPHFです。"},

  {cat:"生物的危害（細菌）", q:"リステリア菌について最も危険な特徴はどれか？",

let currentQ = 0;
let answers = new Array(ALL_QUESTIONS.length).fill(null);
let answered = new Array(ALL_QUESTIONS.length).fill(false);

function startExam() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  loadQuestion(0);
}

function loadQuestion(idx) {
  currentQ = idx;
  const q = ALL_QUESTIONS[idx];
  const total = ALL_QUESTIONS.length;
  document.getElementById('q-num-label').textContent = `問題 ${idx+1} / ${total}`;
  document.getElementById('q-category').textContent = q.cat;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('progress-text').textContent = `${idx+1} / ${total}`;
  document.getElementById('progress-bar-inner').style.width = ((idx+1)/total*100)+'%';

  const letters = ['A','B','C','D','E'];
  const container = document.getElementById('options-container');
  container.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('div');
    btn.className = 'option';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
    btn.onclick = () => selectAnswer(i);
    container.appendChild(btn);
  });

  const exp = document.getElementById('explanation');
  exp.style.display = 'none';
  exp.className = 'explanation';

  if (answered[idx]) showResult(answers[idx], q.ans, q.exp, false);

  document.getElementById('prev-btn').disabled = idx === 0;
  const isLast = idx === total - 1;
  document.getElementById('next-btn').style.display = isLast ? 'none' : 'inline-block';
  document.getElementById('submit-btn').style.display = isLast ? 'inline-block' : 'none';
}

function selectAnswer(optIdx) {
  if (answered[currentQ]) return;
  answers[currentQ] = optIdx;
  answered[currentQ] = true;
  const q = ALL_QUESTIONS[currentQ];
  showResult(optIdx, q.ans, q.exp, true);
}

function showResult(selected, correct, expText, animate) {
  const opts = document.querySelectorAll('.option');
  opts.forEach(o => o.classList.add('disabled'));
  opts[correct].classList.add('correct');
  if (selected !== correct) opts[selected].classList.add('wrong');
  else opts[selected].classList.add('correct');
  const exp = document.getElementById('explanation');
  exp.style.display = 'block';
  const isCorrect = selected === correct;
  exp.className = 'explanation' + (isCorrect ? '' : ' wrong-exp');
  exp.innerHTML = `<div class="exp-title">${isCorrect ? '✓ 正解！' : '✗ 不正解'}</div>${expText}`;
}

function nextQ() { if (currentQ < ALL_QUESTIONS.length - 1) loadQuestion(currentQ + 1); }
function prevQ() { if (currentQ > 0) loadQuestion(currentQ - 1); }

function submitExam() {
  const total = ALL_QUESTIONS.length;
  let correct = 0, unanswered = 0;
  ALL_QUESTIONS.forEach((q, i) => {
    if (answers[i] === null) unanswered++;
    else if (answers[i] === q.ans) correct++;
  });
  const wrong = total - correct - unanswered;
  const score = Math.round((correct / total) * 100);

  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';
  document.getElementById('progress-bar-inner').style.width = '100%';
  document.getElementById('progress-text').textContent = `${total} / ${total}`;
  document.getElementById('score-pct').textContent = score;
  document.getElementById('r-correct').textContent = correct;
  document.getElementById('r-wrong').textContent = wrong;
  document.getElementById('r-unanswered').textContent = unanswered;

  const passed = score >= 85;
  document.getElementById('result-title').textContent = passed ? '合格 PASS' : '不合格 FAIL';
  document.getElementById('result-title').style.color = passed ? 'var(--correct)' : 'var(--wrong)';
  document.getElementById('result-msg').textContent = passed
    ? `おめでとうございます！合格ライン（85点）突破！\n正解率 ${score}% — 素晴らしい結果です！`
    : `合格ライン（85点）まであと${85 - score}点です。\n解説を確認して苦手分野を復習しましょう。`;

  setTimeout(() => {
    const circumference = 503;
    const offset = circumference - (score / 100) * circumference;
    const arc = document.getElementById('score-arc');
    arc.style.transition = 'stroke-dashoffset 1.5s ease';
    arc.style.strokeDashoffset = offset;
    arc.style.stroke = passed ? 'var(--correct)' : 'var(--wrong)';
  }, 100);
}

function showReview() {
  const section = document.getElementById('review-section');
  section.style.display = section.style.display === 'none' ? 'block' : 'none';
  if (section.innerHTML.trim() !== '' && section.style.display === 'none') return;
  const letters = ['A','B','C','D','E'];
  let html = '<div class="review-title">解答レビュー — 全問</div>';
  ALL_QUESTIONS.forEach((q, i) => {
    const isCorrect = answers[i] === q.ans;
    const cls = isCorrect ? 'r-correct' : 'r-wrong';
    let ansText = answers[i] === null ? '未回答' : `${letters[answers[i]]}. ${q.opts[answers[i]]}`;
    html += `<div class="review-item ${cls}">
      <div class="q-num" style="font-size:0.72rem;margin-bottom:7px;color:var(--gold)">${i+1}問目 — ${q.cat}</div>
      <div class="review-q">${q.q}</div>
      <div>
        <div class="ra-label">あなたの回答</div>
        <div class="${isCorrect ? 'ra-correct' : 'ra-wrong'}" style="font-size:0.85rem">${ansText}</div>
        ${!isCorrect ? `<div class="ra-label" style="margin-top:7px">正解</div><div class="ra-correct" style="font-size:0.85rem">${letters[q.ans]}. ${q.opts[q.ans]}</div>` : ''}
        <div class="ra-label" style="margin-top:7px">解説</div>
        <div style="color:var(--text);opacity:0.8;font-size:0.82rem;line-height:1.7">${q.exp}</div>
      </div>
    </div>`;
  });
  section.innerHTML = html;
}

function retryExam() {
  answers = new Array(ALL_QUESTIONS.length).fill(null);
  answered = new Array(ALL_QUESTIONS.length).fill(false);
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('score-arc').style.strokeDashoffset = 503;
  document.getElementById('review-section').style.display = 'none';
  document.getElementById('review-section').innerHTML = '';
  document.getElementById('quiz-screen').style.display = 'block';
  document.getElementById('progress-bar-inner').style.width = '1%';
  loadQuestion(0);
}
</script>
</body>
</html>
