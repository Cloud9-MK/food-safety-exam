<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コストコ フードセーフティー 模擬試験 Level 2 — Vol.3</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

  :root {
    --bg: #0E0E0E;
    --card: #161616;
    --border: #272727;
    --teal: #00897B;
    --accent: #26C6A0;
    --gold: #FFD54F;
    --text: #EAEAEA;
    --muted: #7B7B7B;
    --correct: #43A047;
    --wrong: #E53935;
    --selected: #1565C0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; min-height: 100vh; }

  #header {
    background: linear-gradient(90deg, #004D40 0%, #00695C 100%);
    padding: 14px 28px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 3px 18px rgba(0,0,0,0.6);
    border-bottom: 2px solid var(--accent);
  }
  #header h1 { font-family: 'Rajdhani', sans-serif; font-size: 1.55rem; letter-spacing: 3px; color: #fff; font-weight: 700; }
  .hd-sub { font-size: 0.63rem; color: rgba(255,255,255,0.65); letter-spacing: 2px; margin-bottom: 2px; }
  .vol-badge { background: var(--gold); color: #111; font-family: 'Rajdhani', sans-serif; font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 4px; letter-spacing: 2px; margin-left: 10px; }
  #progress-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  #progress-text { font-size: 0.78rem; color: rgba(255,255,255,0.85); }
  #progress-bar-outer { width: 180px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; }
  #progress-bar-inner { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; transition: width 0.4s; }

  #start-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; padding: 40px 20px; text-align: center; }
  .vol-label { font-family: 'Rajdhani', sans-serif; font-size: 0.8rem; letter-spacing: 5px; color: var(--accent); margin-bottom: 14px; }
  .big-title { font-family: 'Rajdhani', sans-serif; font-size: clamp(2.8rem,7vw,4.8rem); color: #fff; letter-spacing: 3px; line-height: 1.1; margin-bottom: 8px; font-weight: 700; }
  .big-title span { color: var(--accent); }
  .big-sub { font-size: 0.82rem; color: var(--muted); letter-spacing: 2px; margin-bottom: 40px; }
  .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 480px; margin-bottom: 40px; }
  .info-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .info-card .num { font-family: 'Rajdhani', sans-serif; font-size: 2.4rem; color: var(--accent); line-height: 1; font-weight: 700; }
  .info-card .label { font-size: 0.68rem; color: var(--muted); margin-top: 4px; }
  .start-btn { background: var(--teal); color: #fff; border: 1px solid var(--accent); padding: 16px 56px; font-size: 1rem; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; border-radius: 8px; cursor: pointer; letter-spacing: 2px; transition: all 0.15s; box-shadow: 0 4px 20px rgba(0,137,123,0.45); }
  .start-btn:hover { background: #00796B; transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,137,123,0.55); }

  #quiz-screen { display: none; padding: 28px 20px; max-width: 820px; margin: 0 auto; }
  .q-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .q-num { font-family: 'Rajdhani', sans-serif; font-size: 1rem; color: var(--gold); letter-spacing: 2px; font-weight: 600; }
  .q-category { font-size: 0.67rem; background: var(--border); color: var(--muted); padding: 4px 12px; border-radius: 20px; letter-spacing: 1px; }
  .q-text { font-size: 1rem; line-height: 1.85; font-weight: 500; margin-bottom: 24px; padding: 22px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; border-left: 4px solid var(--accent); }
  .options { display: flex; flex-direction: column; gap: 11px; }
  .option { background: var(--card); border: 1.5px solid var(--border); border-radius: 10px; padding: 15px 18px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; transition: border-color 0.15s, background 0.15s, transform 0.1s; font-size: 0.93rem; line-height: 1.65; }
  .option:hover:not(.disabled) { border-color: #444; background: #1c1c1c; transform: translateX(4px); }
  .opt-letter { min-width: 27px; height: 27px; background: var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; color: var(--muted); flex-shrink: 0; transition: background 0.15s, color 0.15s; margin-top: 1px; }
  .option.selected { border-color: var(--selected); background: rgba(21,101,192,0.18); }
  .option.selected .opt-letter { background: var(--selected); color: #fff; }
  .option.correct { border-color: var(--correct); background: rgba(67,160,71,0.1); }
  .option.correct .opt-letter { background: var(--correct); color: #fff; }
  .option.wrong { border-color: var(--wrong); background: rgba(229,57,53,0.1); }
  .option.wrong .opt-letter { background: var(--wrong); color: #fff; }
  .option.disabled { cursor: default; }
  .explanation { display: none; margin-top: 18px; padding: 18px 20px; background: #0b1e14; border: 1px solid var(--correct); border-radius: 10px; font-size: 0.88rem; line-height: 1.85; color: #c6e9d5; }
  .explanation.wrong-exp { background: #1e0b0b; border-color: var(--wrong); color: #f0c6c6; }
  .explanation .exp-title { font-weight: 700; margin-bottom: 8px; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; }
  .nav-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 26px; }
  .nav-btn { padding: 11px 28px; border: none; border-radius: 8px; font-family: 'Noto Sans JP', sans-serif; font-size: 0.9rem; font-weight: 700; cursor: pointer; letter-spacing: 1px; transition: all 0.15s; }
  .nav-btn.primary { background: var(--teal); color: #fff; border: 1px solid var(--accent); }
  .nav-btn.primary:hover { background: #00796B; }
  .nav-btn.secondary { background: var(--border); color: var(--text); border: none; }
  .nav-btn.secondary:hover { background: #333; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  #result-screen { display: none; padding: 50px 20px; max-width: 680px; margin: 0 auto; text-align: center; }
  .score-ring { width: 190px; height: 190px; margin: 0 auto 28px; position: relative; }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring .score-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
  .score-pct { font-family: 'Rajdhani', sans-serif; font-size: 3rem; line-height: 1; color: var(--text); font-weight: 700; }
  .score-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 1px; }
  .result-title { font-family: 'Rajdhani', sans-serif; font-size: 2.3rem; letter-spacing: 3px; margin-bottom: 8px; font-weight: 700; }
  .result-msg { color: var(--muted); margin-bottom: 28px; line-height: 1.8; white-space: pre-line; }
  .result-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 36px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .stat-card .snum { font-family: 'Rajdhani', sans-serif; font-size: 2rem; line-height: 1; font-weight: 700; }
  .stat-card .slabel { font-size: 0.68rem; color: var(--muted); margin-top: 4px; }
  .retry-btn { background: var(--teal); color: #fff; border: 1px solid var(--accent); padding: 14px 44px; font-size: 0.95rem; font-weight: 700; border-radius: 8px; cursor: pointer; letter-spacing: 2px; transition: all 0.15s; margin: 8px; }
  .retry-btn:hover { background: #00796B; }
  .review-section { text-align: left; margin-top: 44px; }
  .review-title { font-family: 'Rajdhani', sans-serif; font-size: 1.4rem; letter-spacing: 2px; color: var(--gold); margin-bottom: 18px; font-weight: 600; }
  .review-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 10px; }
  .review-item.r-wrong { border-color: rgba(229,57,53,0.35); }
  .review-item.r-correct { border-color: rgba(67,160,71,0.2); }
  .review-q { font-size: 0.88rem; margin-bottom: 10px; line-height: 1.6; }
  .ra-label { color: var(--muted); font-size: 0.72rem; margin-bottom: 3px; }
  .ra-correct { color: var(--correct); font-weight: 500; }
  .ra-wrong { color: var(--wrong); }
</style>

<body>

<div id="header">
  <div>
    <div class="hd-sub">COSTCO WHOLESALE JAPAN</div>
    <h1>FOOD SAFETY EXAM <span class="vol-badge">VOL.3</span></h1>
  </div>
  <div id="progress-wrap">
    <span id="progress-text">0 / 100</span>
    <div id="progress-bar-outer"><div id="progress-bar-inner"></div></div>
  </div>
</div>

<div id="start-screen">
  <div class="vol-label">VOLUME 3 — FINAL 100 QUESTIONS</div>
  <div class="big-title">模擬試験<br><span>第3弾</span></div>
  <div class="big-sub">Food Safety Training Level 2 / 一般衛生管理プログラム</div>
  <div class="info-grid">
    <div class="info-card"><div class="num">100</div><div class="label">問題数</div></div>
    <div class="info-card"><div class="num">4-5</div><div class="label">択問題</div></div>
    <div class="info-card"><div class="num">85</div><div class="label">合格点</div></div>
  </div>
  <button class="start-btn" onclick="startExam()">試験開始</button>
</div>

<div id="quiz-screen">
  <div class="q-meta">
    <span class="q-num" id="q-num-label">問題 1 / 100</span>
    <span class="q-category" id="q-category"></span>
  </div>
  <div class="q-text" id="q-text"></div>
  <div class="options" id="options-container"></div>
  <div class="explanation" id="explanation"></div>
  <div class="nav-row">
    <button class="nav-btn secondary" id="prev-btn" onclick="prevQ()">◀ 前へ</button>
    <button class="nav-btn primary" id="next-btn" onclick="nextQ()">次へ ▶</button>
    <button class="nav-btn primary" id="submit-btn" onclick="submitExam()" style="display:none">結果を見る</button>
  </div>
</div>

<div id="result-screen">
  <div class="score-ring">
    <svg width="190" height="190" viewBox="0 0 190 190">
      <circle cx="95" cy="95" r="80" fill="none" stroke="#272727" stroke-width="13"/>
      <circle id="score-arc" cx="95" cy="95" r="80" fill="none" stroke="#00897B" stroke-width="13"
        stroke-linecap="round" stroke-dasharray="503" stroke-dashoffset="503"/>
    </svg>
    <div class="score-text">
      <div class="score-pct" id="score-pct">0</div>
      <div class="score-label">点</div>
    </div>
  </div>
  <div class="result-title" id="result-title">—</div>
  <div class="result-msg" id="result-msg"></div>
  <div class="result-stats">
    <div class="stat-card"><div class="snum" id="r-correct" style="color:var(--correct)">0</div><div class="slabel">正解</div></div>
    <div class="stat-card"><div class="snum" id="r-wrong" style="color:var(--wrong)">0</div><div class="slabel">不正解</div></div>
    <div class="stat-card"><div class="snum" id="r-unanswered" style="color:var(--gold)">0</div><div class="slabel">未回答</div></div>
  </div>
  <button class="retry-btn" onclick="retryExam()">もう一度挑戦</button>
  <button class="retry-btn" style="background:var(--border);color:var(--text);border-color:var(--border)" onclick="showReview()">間違いを確認</button>
  <div class="review-section" id="review-section" style="display:none"></div>
</div>

<script>
const ALL_QUESTIONS = [

  // ===== 食品安全の基本・責任 =====
  {cat:"食品安全の基本", q:"食品安全において「食品業者」が果たすべき責任として最も適切なものはどれか？",
   opts:["生産から消費にいたるフードチェーン全体で食品の安全を確保する責任がある","利益を最大化するために食品安全基準は必要最低限でよい","食品安全は政府機関のみが管理するものである","食品安全は消費者個人の責任である"],
   ans:0, exp:"食品業者は生産・加工・流通・小売など、フードチェーン全体を通じて食品の安全を確保する責任を負っています。"},

  {cat:"食品安全の基本", q:"コストコの食品安全プログラムにおいてデイリーインスペクションの目的として正しいものはどれか？",
   opts:["従業員の勤務態度を評価する","日々の製造・販売作業が食品安全基準を満たしているか確認する","在庫管理を行う","商品の売上データを収集する"],
   ans:1, exp:"デイリーインスペクションは日々の製造・販売作業が食品安全基準を満たしているかを確認するためのプログラムです。"},

  {cat:"食品安全の基本", q:"コストコのHACCPチームに含まれる役職として正しい組み合わせはどれか？",
   opts:["フレッシュフーズマネージャーとゼネラルマネージャーのみ","カントリーマネージャー・フードセーフティーマネージャー・ゼネラルマネージャー・フレッシュフーズマネージャー・アシスタントジェネラルマネージャー","本社のフードセーフティー部門のみ","カントリーマネージャーのみ"],
   ans:1, exp:"コストコのHACCPチームはカントリーマネージャー・フードセーフティーマネージャー・ゼネラルマネージャー・フレッシュフーズマネージャー・アシスタントジェネラルマネージャーで構成されます（PRP 01条 A）。"},

  {cat:"食品安全の基本", q:"コストコの本社フードセーフティー部門のメーリングリストとして正しいものはどれか？",
   opts:["freshdept-jp@costco.co.jp","haccpteam-jp@costco.co.jp","compliance-jp@costco.co.jp","foodsafety-jp@costco.co.jp"],
   ans:3, exp:"本社フードセーフティー部門の共有メーリングリストは foodsafety-jp@costco.co.jp です（PRP 01条 C）。"},

  {cat:"食品安全の基本", q:"「食品安全の問題は製造段階だけに存在する」この記述は正しいか？",
   opts:["正しい。製造さえ管理すれば十分","誤り。農場・輸送・保管・小売・消費者の調理など全段階にリスクが存在する","誤り。小売段階のみにリスクがある","正しい。製造段階が最も重要"],
   ans:1, exp:"食品安全リスクは農場・収穫・加工・包装・輸送・保管・小売・消費者の調理にいたるまで全段階に存在します。"},

  // ===== 食中毒・症状・潜伏 =====
  {cat:"食中毒・症状", q:"食中毒の発症率が高い環境として正しいものはどれか？",
   opts:["食品を密封保存している環境","危険温度区域（4〜60°C）の温度で食品が保管・放置される環境","乾燥した低湿度環境","食品を0°C以下に保管し続ける環境"],
   ans:1, exp:"食中毒が多発する最大の要因は危険温度区域（4〜60°C）での不適切な食品保管・放置です。"},

  {cat:"食中毒・症状", q:"食中毒の原因食品として「カットメロン」が問題となる理由はどれか？",
   opts:["pH・水分活性・栄養素の条件がバクテリアの増殖に適したPHFだから","果物は食中毒を起こさないが例外的なため","農薬が多く残留するため","甘みが強いため"],
   ans:0, exp:"カットメロンはpH4.6〜7.5・水分活性0.85以上・十分な栄養素を持ちPHF（潜在的に危険な食品）に該当するため、バクテリアが増殖しやすい食品です。"},

  {cat:"食中毒・症状", q:"ボツリヌス菌中毒の症状として正しいものはどれか？",
   opts:["激しい腹痛と水様性下痢（6〜18時間後）","皮膚のじんましんと呼吸困難（1時間以内）","視覚異常・複視・嚥下困難・呼吸困難（12〜36時間後）","高熱・関節痛・筋肉痛（2〜5日後）"],
   ans:2, exp:"ボツリヌス菌中毒の主症状は視覚異常・複視・嚥下困難・呼吸困難で、12〜36時間の潜伏期間後に発症し致死率2〜20%と高いです。"},

  {cat:"食中毒・症状", q:"食中毒の「感染型」と「毒素型」の違いとして正しいものはどれか？",
   opts:["感染型は生きたバクテリアを摂取して腸内で増殖し発症し、毒素型はバクテリアが食品中で産生した毒素を摂取して発症する","感染型は食品中の毒素を摂取して発症し、毒素型は生きた菌を摂取して発症する","感染型はウイルスのみ、毒素型はバクテリアのみに使われる","感染型と毒素型は同じ意味で使われる"],
   ans:0, exp:"感染型は生きたバクテリアを摂取し腸内で増殖して発症（例：サルモネラ・カンピロバクター）、毒素型はバクテリアが食品中で産生した毒素を摂取して発症（例：黄色ブドウ球菌・ボツリヌス菌）します。"},

  {cat:"食中毒・症状", q:"腸管出血性大腸菌O-157が特に危険な理由として正しいものはどれか？",
   opts:["高温でも死滅しない","少量の菌でも感染・腸内出血・溶血性尿毒症症候群（HUS）を引き起こし死亡することがある","増殖速度が非常に速い","すべての年齢層に同じく危険"],
   ans:1, exp:"O-157は少量の菌でも感染し、腸内出血・溶血性尿毒症症候群（HUS）を引き起こし、特に子ども・高齢者では死亡することがあります。"},

  {cat:"食中毒・症状", q:"ノロウイルスが「エタノール耐性がある」とはどういう意味か？",
   opts:["乾燥に強い","冷凍しても死滅しない","熱に強い","アルコール（エタノール）消毒が十分な効果を示さない"],
   ans:3, exp:"ノロウイルスはエタノール耐性（アルコール消毒が十分に効かない）があるため、次亜塩素酸ナトリウムによる消毒が有効です。"},

  {cat:"食中毒・症状", q:"A型肝炎の感染源として最も関連が深いものはどれか？",
   opts:["加熱不十分な肉類","汚染された水・二枚貝・感染者が調理した食品","缶詰食品","農薬が残留した野菜"],
   ans:1, exp:"A型肝炎ウイルスは汚染された水・二枚貝・感染した食品取扱者が調理した食品が主な感染源です。"},

  // ===== 細菌の増殖・特性（深掘り） =====
  {cat:"生物的危害（細菌）", q:"バクテリアの増殖曲線において「対数増殖期（log phase）」の説明として正しいものはどれか？",
   opts:["バクテリアが死滅していく段階","バクテリアが最も速く増殖する段階","バクテリアが環境に適応している段階で増殖は遅い","増殖が停止する段階"],

   ans:0, exp:"水の見た目（透明度）だけでは安全性は判断できません。飲料水として適合していることを年1回（コストコでは年2回推奨）の水質検査で確認する必要があります（PRP 14条 B）。"},

// ===== 構文チェック済み =====

let currentQ = 0;
let answers = new Array(ALL_QUESTIONS.length).fill(null);
let answered = new Array(ALL_QUESTIONS.length).fill(false);

function startExam() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  loadQuestion(0);
}

function loadQuestion(idx) {
  currentQ = idx;
  const q = ALL_QUESTIONS[idx];
  const total = ALL_QUESTIONS.length;
  document.getElementById('q-num-label').textContent = `問題 ${idx+1} / ${total}`;
  document.getElementById('q-category').textContent = q.cat;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('progress-text').textContent = `${idx+1} / ${total}`;
  document.getElementById('progress-bar-inner').style.width = ((idx+1)/total*100)+'%';

  const letters = ['A','B','C','D','E'];
  const container = document.getElementById('options-container');
  container.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('div');
    btn.className = 'option';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
    btn.onclick = () => selectAnswer(i);
    container.appendChild(btn);
  });

  const exp = document.getElementById('explanation');
  exp.style.display = 'none';
  exp.className = 'explanation';

  if (answered[idx]) showResult(answers[idx], q.ans, q.exp, false);

  document.getElementById('prev-btn').disabled = idx === 0;
  const isLast = idx === total - 1;
  document.getElementById('next-btn').style.display = isLast ? 'none' : 'inline-block';
  document.getElementById('submit-btn').style.display = isLast ? 'inline-block' : 'none';
}

function selectAnswer(optIdx) {
  if (answered[currentQ]) return;
  answers[currentQ] = optIdx;
  answered[currentQ] = true;
  const q = ALL_QUESTIONS[currentQ];
  showResult(optIdx, q.ans, q.exp, true);
}

function showResult(selected, correct, expText, animate) {
  const opts = document.querySelectorAll('.option');
  opts.forEach(o => o.classList.add('disabled'));
  opts[correct].classList.add('correct');
  if (selected !== correct) opts[selected].classList.add('wrong');
  else opts[selected].classList.add('correct');
  const exp = document.getElementById('explanation');
  exp.style.display = 'block';
  const isCorrect = selected === correct;
  exp.className = 'explanation' + (isCorrect ? '' : ' wrong-exp');
  exp.innerHTML = `<div class="exp-title">${isCorrect ? '✓ 正解！' : '✗ 不正解'}</div>${expText}`;
}

function nextQ() { if (currentQ < ALL_QUESTIONS.length - 1) loadQuestion(currentQ + 1); }
function prevQ() { if (currentQ > 0) loadQuestion(currentQ - 1); }

function submitExam() {
  const total = ALL_QUESTIONS.length;
  let correct = 0, unanswered = 0;
  ALL_QUESTIONS.forEach((q, i) => {
    if (answers[i] === null) unanswered++;
    else if (answers[i] === q.ans) correct++;
  });
  const wrong = total - correct - unanswered;
  const score = Math.round((correct / total) * 100);

  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';
  document.getElementById('progress-bar-inner').style.width = '100%';
  document.getElementById('progress-text').textContent = `${total} / ${total}`;
  document.getElementById('score-pct').textContent = score;
  document.getElementById('r-correct').textContent = correct;
  document.getElementById('r-wrong').textContent = wrong;
  document.getElementById('r-unanswered').textContent = unanswered;

  const passed = score >= 85;
  document.getElementById('result-title').textContent = passed ? '合格 PASS' : '不合格 FAIL';
  document.getElementById('result-title').style.color = passed ? 'var(--correct)' : 'var(--wrong)';
  document.getElementById('result-msg').textContent = passed
    ? `おめでとうございます！合格ライン（85点）突破！\n正解率 ${score}% — 完璧です！`
    : `合格ライン（85点）まであと${85 - score}点です。\n解説を確認して苦手分野を復習しましょう。`;

  setTimeout(() => {
    const circumference = 503;
    const offset = circumference - (score / 100) * circumference;
    const arc = document.getElementById('score-arc');
    arc.style.transition = 'stroke-dashoffset 1.5s ease';
    arc.style.strokeDashoffset = offset;
    arc.style.stroke = passed ? 'var(--correct)' : 'var(--wrong)';
  }, 100);
}

function showReview() {
  const section = document.getElementById('review-section');
  section.style.display = section.style.display === 'none' ? 'block' : 'none';
  if (section.innerHTML.trim() !== '' && section.style.display === 'none') return;
  const letters = ['A','B','C','D','E'];
  let html = '<div class="review-title">解答レビュー — 全問</div>';
  ALL_QUESTIONS.forEach((q, i) => {
    const isCorrect = answers[i] === q.ans;
    const cls = isCorrect ? 'r-correct' : 'r-wrong';
    let ansText = answers[i] === null ? '未回答' : `${letters[answers[i]]}. ${q.opts[answers[i]]}`;
    html += `<div class="review-item ${cls}">
      <div style="font-size:0.72rem;margin-bottom:7px;color:var(--gold);font-family:'Rajdhani',sans-serif;letter-spacing:1px">${i+1}問目 — ${q.cat}</div>
      <div class="review-q">${q.q}</div>
      <div>
        <div class="ra-label">あなたの回答</div>
        <div class="${isCorrect ? 'ra-correct' : 'ra-wrong'}" style="font-size:0.85rem">${ansText}</div>
        ${!isCorrect ? `<div class="ra-label" style="margin-top:7px">正解</div><div class="ra-correct" style="font-size:0.85rem">${letters[q.ans]}. ${q.opts[q.ans]}</div>` : ''}
        <div class="ra-label" style="margin-top:7px">解説</div>
        <div style="color:var(--text);opacity:0.8;font-size:0.82rem;line-height:1.7">${q.exp}</div>
      </div>
    </div>`;
  });
  section.innerHTML = html;
}

function retryExam() {
  answers = new Array(ALL_QUESTIONS.length).fill(null);
  answered = new Array(ALL_QUESTIONS.length).fill(false);
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('score-arc').style.strokeDashoffset = 503;
  document.getElementById('review-section').style.display = 'none';
  document.getElementById('review-section').innerHTML = '';
  document.getElementById('quiz-screen').style.display = 'block';
  document.getElementById('progress-bar-inner').style.width = '1%';
  loadQuestion(0);
}
</script>
