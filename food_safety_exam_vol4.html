<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コストコ フードセーフティー 模擬試験 Level 2 — Vol.4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Barlow+Condensed:wght@500;600;700;800&display=swap');
  :root {
    --bg:#0B0B0F;--card:#131318;--border:#222228;
    --red:#C0392B;--accent:#FF6B6B;--gold:#F39C12;
    --text:#EBEBEB;--muted:#6C6C7A;
    --correct:#27AE60;--wrong:#C0392B;--selected:#1A5276;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh;}
  #header{background:linear-gradient(135deg,#7B241C 0%,#C0392B 100%);padding:13px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 3px 20px rgba(0,0,0,.6);border-bottom:2px solid var(--accent);}
  #header h1{font-family:'Barlow Condensed',sans-serif;font-size:1.55rem;letter-spacing:3px;color:#fff;font-weight:800;}
  .hd-sub{font-size:.62rem;color:rgba(255,255,255,.65);letter-spacing:2px;margin-bottom:2px;}
  .vol-badge{background:var(--gold);color:#111;font-family:'Barlow Condensed',sans-serif;font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:4px;letter-spacing:2px;margin-left:10px;}
  #progress-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
  #progress-text{font-size:.78rem;color:rgba(255,255,255,.85);}
  #progress-bar-outer{width:180px;height:5px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;}
  #progress-bar-inner{height:100%;width:0%;background:var(--accent);border-radius:3px;transition:width .4s;}
  #start-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;padding:40px 20px;text-align:center;}
  .vol-label{font-family:'Barlow Condensed',sans-serif;font-size:.8rem;letter-spacing:5px;color:var(--accent);margin-bottom:14px;}
  .big-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(2.8rem,7vw,4.8rem);color:#fff;letter-spacing:3px;line-height:1.1;margin-bottom:8px;font-weight:800;}
  .big-title span{color:var(--accent);}
  .big-sub{font-size:.82rem;color:var(--muted);letter-spacing:2px;margin-bottom:40px;}
  .info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:480px;margin-bottom:40px;}
  .info-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;}
  .info-card .num{font-family:'Barlow Condensed',sans-serif;font-size:2.4rem;color:var(--accent);line-height:1;font-weight:700;}
  .info-card .label{font-size:.68rem;color:var(--muted);margin-top:4px;}
  .start-btn{background:var(--red);color:#fff;border:1px solid var(--accent);padding:16px 56px;font-size:1rem;font-family:'Noto Sans JP',sans-serif;font-weight:700;border-radius:8px;cursor:pointer;letter-spacing:2px;transition:all .15s;box-shadow:0 4px 20px rgba(192,57,43,.45);}
  .start-btn:hover{background:#922B21;transform:translateY(-2px);}
  #quiz-screen{display:none;padding:28px 20px;max-width:820px;margin:0 auto;}
  .q-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .q-num{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;color:var(--gold);letter-spacing:2px;font-weight:700;}
  .q-category{font-size:.67rem;background:var(--border);color:var(--muted);padding:4px 12px;border-radius:20px;letter-spacing:1px;}
  .q-text{font-size:1rem;line-height:1.85;font-weight:500;margin-bottom:24px;padding:22px;background:var(--card);border:1px solid var(--border);border-radius:12px;border-left:4px solid var(--accent);}
  .options{display:flex;flex-direction:column;gap:11px;}
  .option{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:15px 18px;cursor:pointer;display:flex;align-items:flex-start;gap:12px;transition:border-color .15s,background .15s,transform .1s;font-size:.93rem;line-height:1.65;}
  .option:hover:not(.disabled){border-color:#444;background:#181818;transform:translateX(4px);}
  .opt-letter{min-width:27px;height:27px;background:var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--muted);flex-shrink:0;transition:background .15s,color .15s;margin-top:1px;}
  .option.selected{border-color:var(--selected);background:rgba(26,82,118,.18);}
  .option.selected .opt-letter{background:var(--selected);color:#fff;}
  .option.correct{border-color:var(--correct);background:rgba(39,174,96,.1);}
  .option.correct .opt-letter{background:var(--correct);color:#fff;}
  .option.wrong{border-color:var(--wrong);background:rgba(192,57,43,.1);}
  .option.wrong .opt-letter{background:var(--wrong);color:#fff;}
  .option.disabled{cursor:default;}
  .explanation{display:none;margin-top:18px;padding:18px 20px;background:#0a1a0e;border:1px solid var(--correct);border-radius:10px;font-size:.88rem;line-height:1.85;color:#c0e8cc;}
  .explanation.wrong-exp{background:#1a0a0a;border-color:var(--wrong);color:#f0c0c0;}
  .explanation .exp-title{font-weight:700;margin-bottom:8px;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;}
  .nav-row{display:flex;justify-content:flex-end;gap:10px;margin-top:26px;}
  .nav-btn{padding:11px 28px;border:none;border-radius:8px;font-family:'Noto Sans JP',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;letter-spacing:1px;transition:all .15s;}
  .nav-btn.primary{background:var(--red);color:#fff;border:1px solid var(--accent);}
  .nav-btn.primary:hover{background:#922B21;}
  .nav-btn.secondary{background:var(--border);color:var(--text);border:none;}
  .nav-btn.secondary:hover{background:#2c2c30;}
  .nav-btn:disabled{opacity:.35;cursor:not-allowed;}
  #result-screen{display:none;padding:50px 20px;max-width:680px;margin:0 auto;text-align:center;}
  .score-ring{width:190px;height:190px;margin:0 auto 28px;position:relative;}
  .score-ring svg{transform:rotate(-90deg);}
  .score-ring .score-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
  .score-pct{font-family:'Barlow Condensed',sans-serif;font-size:3rem;line-height:1;color:var(--text);font-weight:700;}
  .score-label{font-size:.65rem;color:var(--muted);letter-spacing:1px;}
  .result-title{font-family:'Barlow Condensed',sans-serif;font-size:2.3rem;letter-spacing:3px;margin-bottom:8px;font-weight:800;}
  .result-msg{color:var(--muted);margin-bottom:28px;line-height:1.8;white-space:pre-line;}
  .result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:36px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;}
  .stat-card .snum{font-family:'Barlow Condensed',sans-serif;font-size:2rem;line-height:1;font-weight:700;}
  .stat-card .slabel{font-size:.68rem;color:var(--muted);margin-top:4px;}
  .retry-btn{background:var(--red);color:#fff;border:1px solid var(--accent);padding:14px 44px;font-size:.95rem;font-weight:700;border-radius:8px;cursor:pointer;letter-spacing:2px;transition:all .15s;margin:8px;}
  .retry-btn:hover{background:#922B21;}
  .review-section{text-align:left;margin-top:44px;}
  .review-title{font-family:'Barlow Condensed',sans-serif;font-size:1.5rem;letter-spacing:2px;color:var(--gold);margin-bottom:18px;font-weight:700;}
  .review-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:10px;}
  .review-item.r-wrong{border-color:rgba(192,57,43,.38);}
  .review-item.r-correct{border-color:rgba(39,174,96,.22);}
  .review-q{font-size:.88rem;margin-bottom:10px;line-height:1.6;}
  .ra-label{color:var(--muted);font-size:.72rem;margin-bottom:3px;}
  .ra-correct{color:var(--correct);font-weight:500;}
  .ra-wrong{color:var(--wrong);}
</style>

<body>
<div id="header">
  <div>
    <div class="hd-sub">COSTCO WHOLESALE JAPAN</div>
    <h1>FOOD SAFETY EXAM <span class="vol-badge">VOL.4</span></h1>
  </div>
  <div id="progress-wrap">
    <span id="progress-text">0 / 100</span>
    <div id="progress-bar-outer"><div id="progress-bar-inner"></div></div>
  </div>
</div>

<div id="start-screen">
  <div class="vol-label">VOLUME 4 — ADVANCED VARIETY</div>
  <div class="big-title">模擬試験<br><span>第4弾</span></div>
  <div class="big-sub">Food Safety Training Level 2 / 一般衛生管理プログラム</div>
  <div class="info-grid">
    <div class="info-card"><div class="num">100</div><div class="label">問題数</div></div>
    <div class="info-card"><div class="num">4-5</div><div class="label">択問題</div></div>
    <div class="info-card"><div class="num">85</div><div class="label">合格点</div></div>
  </div>
  <button class="start-btn" onclick="startExam()">試験開始</button>
</div>

<div id="quiz-screen">
  <div class="q-meta">
    <span class="q-num" id="q-num-label">問題 1 / 100</span>
    <span class="q-category" id="q-category"></span>
  </div>
  <div class="q-text" id="q-text"></div>
  <div class="options" id="options-container"></div>
  <div class="explanation" id="explanation"></div>
  <div class="nav-row">
    <button class="nav-btn secondary" id="prev-btn" onclick="prevQ()">◀ 前へ</button>
    <button class="nav-btn primary" id="next-btn" onclick="nextQ()">次へ ▶</button>
    <button class="nav-btn primary" id="submit-btn" onclick="submitExam()" style="display:none">結果を見る</button>
  </div>
</div>

<div id="result-screen">
  <div class="score-ring">
    <svg width="190" height="190" viewBox="0 0 190 190">
      <circle cx="95" cy="95" r="80" fill="none" stroke="#222228" stroke-width="13"/>
      <circle id="score-arc" cx="95" cy="95" r="80" fill="none" stroke="#C0392B" stroke-width="13"
        stroke-linecap="round" stroke-dasharray="503" stroke-dashoffset="503"/>
    </svg>
    <div class="score-text">
      <div class="score-pct" id="score-pct">0</div>
      <div class="score-label">点</div>
    </div>
  </div>
  <div class="result-title" id="result-title">—</div>
  <div class="result-msg" id="result-msg"></div>
  <div class="result-stats">
    <div class="stat-card"><div class="snum" id="r-correct" style="color:var(--correct)">0</div><div class="slabel">正解</div></div>
    <div class="stat-card"><div class="snum" id="r-wrong" style="color:var(--wrong)">0</div><div class="slabel">不正解</div></div>
    <div class="stat-card"><div class="snum" id="r-unanswered" style="color:var(--gold)">0</div><div class="slabel">未回答</div></div>
  </div>
  <button class="retry-btn" onclick="retryExam()">もう一度挑戦</button>
  <button class="retry-btn" style="background:var(--border);color:var(--text);border-color:var(--border)" onclick="showReview()">間違いを確認</button>
  <div class="review-section" id="review-section" style="display:none"></div>
</div>

<script>
const ALL_QUESTIONS = [

// ── 1. 穴埋め形式 ──────────────────────────────
{cat:"穴埋め", q:"「危険温度区域とは（　A　）°C〜（　B　）°Cの範囲を指す」A・Bの正しい組み合わせはどれか？",
 opts:["A=4、B=60","A=0、B=40","A=5、B=65","A=10、B=70"],
 ans:0, exp:"危険温度区域は4°C（40°F）〜60°C（140°F）です。この範囲でバクテリアが急速に増殖します。"},

{cat:"穴埋め", q:"「冷凍食品は（　　）°C以下で保管しなければならない」空欄に入る数値として正しいものはどれか？",
 opts:["−10","−25","−18","-5"],
 ans:2, exp:"冷凍食品は−18°C（0°F）以下で保管しなければなりません。"},

{cat:"穴埋め", q:"「コストコでは塩素系サニタイザーは（　　）ppmで（　　）分間浸漬する」正しい組み合わせはどれか？",
 opts:["100 ppm・3分","50 ppm・10分","200 ppm・5分","500 ppm・1分"],
 ans:2, exp:"コストコが定める塩素系サニタイザーの消毒条件は200 ppmで5分間浸漬です（PRP 10条）。"},

{cat:"穴埋め", q:"「加熱調理後の食品の冷却は（　A　）分以内に20°C以下、かつ（　B　）分以内に10°C以下にする」A・Bの正しい組み合わせはどれか？",
 opts:["A=60、B=120","A=20、B=40","A=45、B=90","A=30、B=60"],
 ans:3, exp:"冷却は30分以内に20°C以下、かつ60分以内に10°C以下にする必要があります（大量調理施設衛生管理マニュアル・PRP 08条 Q）。"},

{cat:"穴埋め", q:"「手洗いはハンドソープをつけてから（　　）秒間洗わなければならない」正しい秒数はどれか？",
 opts:["10秒","60秒","30秒","20秒"],
 ans:2, exp:"コストコではハンドソープをつけてから非接触式タイマーで最低30秒間手を洗います（PRP 02条 C）。"},

{cat:"穴埋め", q:"「受領した温度管理が必要な食品は（　　）分以内に適切な保管庫へ移動させる」正しいものはどれか？",
 opts:["10分","30分","20分","60分"],
 ans:2, exp:"温度管理が必要な食品は受領後20分以内に既定の温度帯の保管庫へ移動させなければなりません（PRP 06条）。"},

{cat:"穴埋め", q:"「再加熱は中心温度（　　）°C以上を（　　）秒以上保持し、再加熱開始から（　　）時間以内に完了する」正しい組み合わせはどれか？",
 opts:["63°C・30秒・1時間","80°C・14秒・1時間","85°C・90秒・3時間","74°C・15秒・2時間"],
 ans:3, exp:"再加熱の基準は中心温度74°C以上・15秒以上保持・再加熱開始から2時間以内の完了です（PRP 08条 Q）。"},

{cat:"穴埋め", q:"「冷蔵庫・冷凍庫の温度は（　　）時間ごとにTemp Check Walk Logに記録する」正しいものはどれか？",
 opts:["4時間","8時間","1時間","2時間"],
 ans:3, exp:"全ての冷蔵庫・冷凍庫は2時間ごとに温度を点検し記録します（PRP 10条）。"},

{cat:"穴埋め", q:"「食品安全トレーニングLevel 2に合格するには（　　）点以上のスコアが必要」正しいものはどれか？",
 opts:["85点","70点","80点","75点"],
 ans:0, exp:"Food Safety Training Level 2の合格ラインは85点以上です（PRP 05条）。"},

{cat:"穴埋め", q:"「包丁殺菌庫の紫外線灯は最低でも（　　）か月に1度交換する」正しいものはどれか？",
 opts:["6か月","3か月","24か月","12か月"],
 ans:0, exp:"包丁殺菌庫の殺菌紫外線灯は最低6か月に1度交換しなければなりません（PRP 10条 N）。"},

// ── 2. 「誤っているものを選べ」形式 ──────────
{cat:"誤り選択", q:"FATTOMの6因子について正しく説明しているものを選べ。次のうち誤っているものはどれか？",
 opts:["F（Food）：バクテリアは増殖に栄養を必要とする","O（Oxygen）：全てのバクテリアは酸素を必要とする","T（Temperature）：バクテリアは4〜60°Cで増殖が活発","A（Acidity）：バクテリアはpH4.6〜7.5の食品を好む"],
 ans:1, exp:"Oのポイントは「酸素の有無」への適応性です。偏性嫌気性細菌は酸素がない環境でのみ増殖できるため、「全てのバクテリアが酸素を必要とする」は誤りです。"},

{cat:"誤り選択", q:"手洗いの正しい手順として誤っているものはどれか？",
 opts:["使い捨てペーパータオルで水分を拭き取る","流温水で手を濡らす","洗い終わったらエプロンで水分を拭き取る","ハンドソープをつけて30秒間洗う"],
 ans:2, exp:"エプロンや作業着で手を拭くことは再汚染の原因となるため禁止です。必ず使い捨てペーパータオルを使用します（PRP 02条）。"},

{cat:"誤り選択", q:"リステリア菌の特徴として誤っているものはどれか？",
 opts:["4°C以下でも増殖できる","芽胞を形成する","生ハムやスモークサーモンが主なPHF","潜伏期間が1日〜10週間と非常に長い"],
 ans:1, exp:"リステリア菌は芽胞を形成しません。芽胞形成菌はボツリヌス菌・ウェルシュ菌・セレウス菌などです。"},

{cat:"誤り選択", q:"食品の正しい保管温度の組み合わせとして誤っているものはどれか？",
 opts:["常温食品：10〜21°C","冷凍食品：−18°C以下","温かい食品のホールド：50°C以上","冷蔵食品：4°C以下"],
 ans:2, exp:"温かい食品のホールドは60°C（140°F）以上が必要です。50°Cは危険温度区域（4〜60°C）内となり、バクテリアの増殖リスクがあります。"},

{cat:"誤り選択", q:"コストコのエプロン色分けルールについて誤っているものはどれか？",
 opts:["D88：黄エプロン＝商品製造（調理中）の取扱い","D63：白エプロン＝加熱調理済み食品の取扱い","D61：青エプロン＝生の鶏肉の取扱い","D61：赤エプロン＝加熱調理済み食品の取扱い"],
 ans:0, exp:"D88（フードコート）の黄エプロンはサニテーション・清掃作業時に使用します。商品製造（調理中）は白エプロンです（PRP 04条 H）。"},

{cat:"誤り選択", q:"ノロウイルスに関して誤っているものはどれか？",
 opts:["食品中では増殖できず、ヒトの腸管のみで増殖する","二次感染が起きやすい","加熱調理（85°C/90秒）では死滅しない","エタノール（アルコール）消毒に耐性がある"],
 ans:2, exp:"ノロウイルスは85°C以上・90秒以上の加熱で死滅します。「加熱で死滅しない」は誤りです。ただしアルコール消毒には耐性があります。"},

{cat:"誤り選択", q:"清掃の5段階について誤っているものはどれか？",
 opts:["第5段階：自然乾燥（空気乾燥）させる","第3段階：消毒してから流水ですすぐ","第1段階：大まかな汚れ・食品残渣を除去する","第2段階：適切な洗剤で洗う"],
 ans:1, exp:"正しい順番は①汚れ除去→②洗剤で洗う→③流水ですすぐ→④消毒する→⑤自然乾燥です。「消毒してからすすぐ」は誤りで、消毒は残留させます（PRP 10条）。"},

{cat:"誤り選択", q:"PHF（潜在的に危険な食品）に関して誤っているものはどれか？",
 opts:["加熱済みの豆類はPHFに該当する","加熱不十分な鶏肉はPHFに該当する","カットメロンはPHFに該当する","水分活性0.60以下の食品はPHFに該当する"],
 ans:3, exp:"水分活性0.60以下の食品（乾燥食品・高塩分食品など）はバクテリアが増殖できないためPHFには該当しません。PHFの水分活性基準は0.85以上です。"},

{cat:"誤り選択", q:"記録管理について誤っているものはどれか？",
 opts:["記録には永久インクのボールペンを使用する","フリクションボールペンは使用できる","記録の保管期間の記載がない場合は最低1年間保管する","訂正は二重線で消し正しい内容を記載する"],

}

function loadQuestion(idx){
  currentQ=idx;
  const q=ALL_QUESTIONS[idx];
  const total=ALL_QUESTIONS.length;
  document.getElementById('q-num-label').textContent=`問題 ${idx+1} / ${total}`;
  document.getElementById('q-category').textContent=q.cat;
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('progress-text').textContent=`${idx+1} / ${total}`;
  document.getElementById('progress-bar-inner').style.width=((idx+1)/total*100)+'%';
  const letters=['A','B','C','D','E'];
  const container=document.getElementById('options-container');
  container.innerHTML='';
  q.opts.forEach((opt,i)=>{
    const btn=document.createElement('div');
    btn.className='option';
    btn.innerHTML=`<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
    btn.onclick=()=>selectAnswer(i);
    container.appendChild(btn);
  });
  const exp=document.getElementById('explanation');
  exp.style.display='none';
  exp.className='explanation';
  if(answered[idx]) showResult(answers[idx],q.ans,q.exp,false);
  document.getElementById('prev-btn').disabled=idx===0;
  const isLast=idx===total-1;
  document.getElementById('next-btn').style.display=isLast?'none':'inline-block';
  document.getElementById('submit-btn').style.display=isLast?'inline-block':'none';
}

function selectAnswer(optIdx){
  if(answered[currentQ]) return;
  answers[currentQ]=optIdx;
  answered[currentQ]=true;
  const q=ALL_QUESTIONS[currentQ];
  showResult(optIdx,q.ans,q.exp,true);
}

function showResult(selected,correct,expText,animate){
  const opts=document.querySelectorAll('.option');
  opts.forEach(o=>o.classList.add('disabled'));
  opts[correct].classList.add('correct');
  if(selected!==correct) opts[selected].classList.add('wrong');
  else opts[selected].classList.add('correct');
  const exp=document.getElementById('explanation');
  exp.style.display='block';
  const isCorrect=selected===correct;
  exp.className='explanation'+(isCorrect?'':' wrong-exp');
  exp.innerHTML=`<div class="exp-title">${isCorrect?'✓ 正解！':'✗ 不正解'}</div>${expText}`;
}

function nextQ(){if(currentQ<ALL_QUESTIONS.length-1) loadQuestion(currentQ+1);}
function prevQ(){if(currentQ>0) loadQuestion(currentQ-1);}

function submitExam(){
  const total=ALL_QUESTIONS.length;
  let correct=0,unanswered=0;
  ALL_QUESTIONS.forEach((q,i)=>{
    if(answers[i]===null) unanswered++;
    else if(answers[i]===q.ans) correct++;
  });
  const wrong=total-correct-unanswered;
  const score=Math.round((correct/total)*100);
  document.getElementById('quiz-screen').style.display='none';
  document.getElementById('result-screen').style.display='block';
  document.getElementById('progress-bar-inner').style.width='100%';
  document.getElementById('progress-text').textContent=`${total} / ${total}`;
  document.getElementById('score-pct').textContent=score;
  document.getElementById('r-correct').textContent=correct;
  document.getElementById('r-wrong').textContent=wrong;
  document.getElementById('r-unanswered').textContent=unanswered;
  const passed=score>=85;
  document.getElementById('result-title').textContent=passed?'合格 PASS':'不合格 FAIL';
  document.getElementById('result-title').style.color=passed?'var(--correct)':'var(--wrong)';
  document.getElementById('result-msg').textContent=passed
    ?`おめでとうございます！合格ライン（85点）突破！\n正解率 ${score}% — 完璧です！`
    :`合格ライン（85点）まであと${85-score}点です。\n解説を確認して苦手分野を復習しましょう。`;
  setTimeout(()=>{
    const arc=document.getElementById('score-arc');
    arc.style.transition='stroke-dashoffset 1.5s ease';
    arc.style.strokeDashoffset=503-(score/100)*503;
    arc.style.stroke=passed?'var(--correct)':'var(--wrong)';
  },100);
}

function showReview(){
  const section=document.getElementById('review-section');
  section.style.display=section.style.display==='none'?'block':'none';
  if(section.innerHTML.trim()!==''&&section.style.display==='none') return;
  const letters=['A','B','C','D','E'];
  let html='<div class="review-title">解答レビュー — 全問</div>';
  ALL_QUESTIONS.forEach((q,i)=>{
    const isCorrect=answers[i]===q.ans;
    const cls=isCorrect?'r-correct':'r-wrong';
    let ansText=answers[i]===null?'未回答':`${letters[answers[i]]}. ${q.opts[answers[i]]}`;
    html+=`<div class="review-item ${cls}">
      <div style="font-size:.72rem;margin-bottom:7px;color:var(--gold);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px">${i+1}問目 — ${q.cat}</div>
      <div class="review-q">${q.q}</div>
      <div>
        <div class="ra-label">あなたの回答</div>
        <div class="${isCorrect?'ra-correct':'ra-wrong'}" style="font-size:.85rem">${ansText}</div>
        ${!isCorrect?`<div class="ra-label" style="margin-top:7px">正解</div><div class="ra-correct" style="font-size:.85rem">${letters[q.ans]}. ${q.opts[q.ans]}</div>`:''}
        <div class="ra-label" style="margin-top:7px">解説</div>
        <div style="color:var(--text);opacity:.8;font-size:.82rem;line-height:1.7">${q.exp}</div>
      </div>
    </div>`;
  });
  section.innerHTML=html;
}

function retryExam(){
  answers=new Array(ALL_QUESTIONS.length).fill(null);
  answered=new Array(ALL_QUESTIONS.length).fill(false);
  document.getElementById('result-screen').style.display='none';
  document.getElementById('score-arc').style.strokeDashoffset=503;
  document.getElementById('review-section').style.display='none';
  document.getElementById('review-section').innerHTML='';
  document.getElementById('quiz-screen').style.display='block';
  document.getElementById('progress-bar-inner').style.width='1%';
  loadQuestion(0);
}
</script>
</body>
</html>
