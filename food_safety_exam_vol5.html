<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コストコ フードセーフティー 模擬試験 Level 2 — Vol.5</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Syne:wght@700;800&display=swap');
:root{
  --bg:#08090D;--card:#10121A;--border:#1E2130;
  --purple:#5B4FE9;--accent:#A78BFA;--gold:#FBBF24;
  --text:#F1F0FF;--muted:#6B7280;
  --correct:#10B981;--wrong:#EF4444;--selected:#1E40AF;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh;}
#header{
  background:linear-gradient(135deg,#1E1B4B 0%,#3730A3 60%,#5B4FE9 100%);
  padding:13px 26px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  box-shadow:0 4px 24px rgba(91,79,233,.4);
  border-bottom:2px solid var(--accent);
}
#header h1{font-family:'Syne',sans-serif;font-size:1.5rem;letter-spacing:2px;color:#fff;font-weight:800;}
.hd-sub{font-size:.62rem;color:rgba(255,255,255,.6);letter-spacing:2px;margin-bottom:2px;}
.vol-badge{background:var(--gold);color:#111;font-family:'Syne',sans-serif;font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:4px;letter-spacing:2px;margin-left:10px;}
#pw{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
#pt{font-size:.78rem;color:rgba(255,255,255,.85);}
#pbo{width:180px;height:5px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;}
#pbi{height:100%;width:0%;background:var(--accent);border-radius:3px;transition:width .4s;}
#start{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;padding:40px 20px;text-align:center;}
.vl{font-family:'Syne',sans-serif;font-size:.78rem;letter-spacing:5px;color:var(--accent);margin-bottom:14px;}
.bt{font-family:'Syne',sans-serif;font-size:clamp(2.6rem,6.5vw,4.5rem);color:#fff;letter-spacing:2px;line-height:1.1;margin-bottom:8px;font-weight:800;}
.bt span{color:var(--accent);}
.tl{font-size:.9rem;color:var(--gold);letter-spacing:1px;margin-bottom:6px;}
.bs{font-size:.8rem;color:var(--muted);margin-bottom:40px;}
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:480px;margin-bottom:40px;}
.ic{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;}
.ic .n{font-family:'Syne',sans-serif;font-size:2.4rem;color:var(--accent);line-height:1;font-weight:700;}
.ic .l{font-size:.68rem;color:var(--muted);margin-top:4px;}
.sb{background:var(--purple);color:#fff;border:1px solid var(--accent);padding:16px 56px;font-size:1rem;font-weight:700;border-radius:8px;cursor:pointer;letter-spacing:2px;transition:all .15s;box-shadow:0 4px 24px rgba(91,79,233,.5);}
.sb:hover{background:#4338CA;transform:translateY(-2px);}
#quiz{display:none;padding:28px 20px;max-width:820px;margin:0 auto;}
.qm{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.qn{font-family:'Syne',sans-serif;font-size:1rem;color:var(--gold);letter-spacing:2px;font-weight:700;}
.qcat{font-size:.67rem;background:var(--border);color:var(--muted);padding:4px 12px;border-radius:20px;}
.trap{display:none;font-size:.65rem;background:rgba(239,68,68,.15);color:#F87171;border:1px solid rgba(239,68,68,.3);padding:3px 10px;border-radius:20px;margin-right:6px;}
.trap.on{display:inline-block;}
.qt{font-size:1rem;line-height:1.9;font-weight:500;margin-bottom:22px;padding:22px;background:var(--card);border:1px solid var(--border);border-radius:12px;border-left:4px solid var(--accent);}
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:15px 18px;cursor:pointer;display:flex;align-items:flex-start;gap:12px;transition:border-color .15s,background .15s,transform .1s;font-size:.93rem;line-height:1.65;}
.opt:hover:not(.dis){border-color:#334;background:#13151F;transform:translateX(4px);}
.ol{min-width:27px;height:27px;background:var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--muted);flex-shrink:0;margin-top:1px;transition:background .15s,color .15s;}
.opt.sel{border-color:var(--selected);background:rgba(30,64,175,.18);}
.opt.sel .ol{background:var(--selected);color:#fff;}
.opt.cor{border-color:var(--correct);background:rgba(16,185,129,.1);}
.opt.cor .ol{background:var(--correct);color:#fff;}
.opt.wrg{border-color:var(--wrong);background:rgba(239,68,68,.1);}
.opt.wrg .ol{background:var(--wrong);color:#fff;}
.opt.dis{cursor:default;}
.exp{display:none;margin-top:16px;padding:18px 20px;background:#061410;border:1px solid var(--correct);border-radius:10px;font-size:.88rem;line-height:1.9;color:#A7F3D0;}
.exp.we{background:#140606;border-color:var(--wrong);color:#FECACA;}
.exp .et{font-weight:700;margin-bottom:6px;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;}
.exp .ep{margin-top:10px;padding:8px 12px;background:rgba(251,191,36,.08);border-left:3px solid var(--gold);border-radius:4px;font-size:.82rem;color:var(--gold);}
.nr{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;}
.nb{padding:11px 28px;border:none;border-radius:8px;font-family:'Noto Sans JP',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;letter-spacing:1px;transition:all .15s;}
.nb.p{background:var(--purple);color:#fff;border:1px solid var(--accent);}
.nb.p:hover{background:#4338CA;}
.nb.s{background:var(--border);color:var(--text);}
.nb.s:hover{background:#252840;}
.nb:disabled{opacity:.35;cursor:not-allowed;}
#result{display:none;padding:50px 20px;max-width:680px;margin:0 auto;text-align:center;}
.sr{width:200px;height:200px;margin:0 auto 28px;position:relative;}
.sr svg{transform:rotate(-90deg);}
.sr .st{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.sp{font-family:'Syne',sans-serif;font-size:3.2rem;line-height:1;color:var(--text);font-weight:800;}
.sl{font-size:.65rem;color:var(--muted);}
.rt{font-family:'Syne',sans-serif;font-size:2.2rem;letter-spacing:2px;margin-bottom:8px;font-weight:800;}
.rm{color:var(--muted);margin-bottom:28px;line-height:1.8;white-space:pre-line;}
.rsg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:36px;}
.rsc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;}
.rsn{font-family:'Syne',sans-serif;font-size:2rem;line-height:1;font-weight:700;}
.rsl{font-size:.68rem;color:var(--muted);margin-top:4px;}
.rb{background:var(--purple);color:#fff;border:1px solid var(--accent);padding:14px 44px;font-size:.95rem;font-weight:700;border-radius:8px;cursor:pointer;letter-spacing:2px;transition:all .15s;margin:8px;}
.rb:hover{background:#4338CA;}
.rvs{text-align:left;margin-top:44px;}
.rvt{font-family:'Syne',sans-serif;font-size:1.4rem;letter-spacing:2px;color:var(--gold);margin-bottom:18px;font-weight:700;}
.rvi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:10px;}
.rvi.rw{border-color:rgba(239,68,68,.35);}
.rvi.rc{border-color:rgba(16,185,129,.22);}
.rvq{font-size:.88rem;margin-bottom:10px;line-height:1.6;}
.ral{color:var(--muted);font-size:.72rem;margin-bottom:3px;}
.rac{color:var(--correct);font-weight:500;}
.raw{color:var(--wrong);}
</style>

</head>
<body>
<div id="header">
  <div><div class="hd-sub">COSTCO WHOLESALE JAPAN</div><h1>FOOD SAFETY EXAM <span class="vol-badge">VOL.5</span></h1></div>
  <div id="pw"><span id="pt">0 / 100</span><div id="pbo"><div id="pbi"></div></div></div>
</div>
<div id="start">
  <div class="vl">VOLUME 5 — PASS GUARANTEE EDITION</div>
  <div class="bt">模擬試験<br><span>第5弾</span></div>
  <div class="tl">⚡ 絶対合格のために設計された100問</div>
  <div class="bs">本番で出やすい・間違えやすい・数値が似ているポイントを厳選</div>
  <div class="ig">
    <div class="ic"><div class="n">100</div><div class="l">問題数</div></div>
    <div class="ic"><div class="n">4-5</div><div class="l">択問題</div></div>
    <div class="ic"><div class="n">85</div><div class="l">合格点</div></div>
  </div>
  <button class="sb" onclick="start()">試験開始</button>
</div>
<div id="quiz">
  <div class="qm">
    <span class="qn" id="qn">問題 1 / 100</span>
    <div style="display:flex;align-items:center;">
      <span class="trap" id="trap">⚠ ひっかけ注意</span>
      <span class="qcat" id="qcat"></span>
    </div>
  </div>
  <div class="qt" id="qt"></div>
  <div class="opts" id="opts"></div>
  <div class="exp" id="exp"></div>
  <div class="nr">
    <button class="nb s" id="pb" onclick="prev()">◀ 前へ</button>
    <button class="nb p" id="nb" onclick="next()">次へ ▶</button>
    <button class="nb p" id="sub" onclick="submit()" style="display:none">結果を見る</button>
  </div>
</div>
<div id="result">
  <div class="sr">
    <svg width="200" height="200" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="85" fill="none" stroke="#1E2130" stroke-width="13"/>
      <circle id="arc" cx="100" cy="100" r="85" fill="none" stroke="#5B4FE9" stroke-width="13"
        stroke-linecap="round" stroke-dasharray="534" stroke-dashoffset="534"/>
    </svg>
    <div class="st"><div class="sp" id="sp">0</div><div class="sl">点</div></div>
  </div>
  <div class="rt" id="rtt">—</div>
  <div class="rm" id="rm"></div>
  <div class="rsg">
    <div class="rsc"><div class="rsn" id="rc" style="color:var(--correct)">0</div><div class="rsl">正解</div></div>
    <div class="rsc"><div class="rsn" id="rw" style="color:var(--wrong)">0</div><div class="rsl">不正解</div></div>
    <div class="rsc"><div class="rsn" id="ru" style="color:var(--gold)">0</div><div class="rsl">未回答</div></div>
  </div>
  <button class="rb" onclick="retry()">もう一度挑戦</button>
  <button class="rb" style="background:var(--border);border-color:var(--border)" onclick="review()">間違いを確認</button>
  <div class="rvs" id="rvs" style="display:none"></div>
</div>
<script>
const Q=[
// Vol.5 — 100 questions
// Format: {c:category, q:question, o:[opts], a:answer_index, e:explanation, t:trap(bool), p:point}

{c:"数値ひっかけ",t:true,
 q:"危険温度区域の正しい範囲はどれか？",
 o:["10°C〜70°C","0°C〜40°C","4°C〜60°C","5°C〜65°C"],
 a:2,e:"危険温度区域は4°C（40°F）〜60°C（140°F）です。この範囲でバクテリアが最も活発に増殖します。",
 p:"🔢 4〜60°C は食品安全の最重要数値！必ず正確に"},

{c:"数値ひっかけ",t:true,
 q:"冷凍保管と冷蔵保管の正しい温度の組み合わせはどれか？",
 o:["冷凍−18°C以下・冷蔵10°C以下","冷凍−15°C以下・冷蔵4°C以下","冷凍−10°C以下・冷蔵5°C以下","冷凍−18°C以下・冷蔵4°C以下"],
 a:3,e:"冷凍は−18°C（0°F）以下、冷蔵は4°C（40°F）以下が正しい基準です。−10°Cや−15°Cは不十分です。",
 p:"🔢 冷凍=−18°C・冷蔵=4°C セットで暗記！"},

{c:"数値ひっかけ",t:true,
 q:"加熱調理後の冷却の正しい基準はどれか？",
 o:["2時間以内に20°C以下にすれば十分","60分以内に10°C以下のみ達成すればよい","30分以内に20°C以下 かつ 60分以内に10°C以下の両方を達成する","1時間以内に4°C以下にする"],
 a:2,e:"「30分以内に20°C以下」AND「60分以内に10°C以下」の両方が必要です。片方だけでは不十分です。",
 p:"🔢 冷却=30分/20°C と 60分/10°C は両方セット！"},

{c:"数値ひっかけ",t:true,
 q:"再加熱の正しい基準はどれか？",
 o:["中心温度80°C以上達温","中心温度63°C/30分（最初の加熱と同じ）","中心温度75°C/1分以上","中心温度74°C以上・15秒以上保持 かつ 再加熱開始から2時間以内に完了"],
 a:3,e:"再加熱は74°C/15秒以上かつ再加熱開始から2時間以内の完了が必要です。63°C/30分は「最初の加熱」基準。混同注意！",
 p:"🔢 最初の加熱=63°C/30分・再加熱=74°C/15秒 区別する！"},

{c:"数値ひっかけ",t:true,
 q:"ロティサリーチキンの加熱基準（胸部分ともも部分）の正しい組み合わせはどれか？",
 o:["胸・もも両方：84°C","胸：84°C・もも：77°C","胸：77°C・もも：84°C","胸・もも両方：80°C/14秒"],
 a:1,e:"胸部分は84°C（183°F）以上達温、もも部分は77°C（170°F）以上達温です。胸の方が高温という点が逆に覚えられやすいので要注意！",
 p:"🍗 ロティサリー：胸=84°C・もも=77°C　胸の方が高い！"},

{c:"数値ひっかけ",t:true,
 q:"グリルチキンの加熱基準として正しいものはどれか？",
 o:["中心温度84°C以上達温","中心温度77°C以上達温","中心温度75°C/1分以上","中心温度80°C（176°F）以上・14秒以上保持"],
 a:3,e:"グリルチキンは80°C（176°F）以上・14秒以上保持です。ロティサリー胸（84°C）・もも（77°C）・二枚貝（85〜90°C/90秒）と全て区別して覚えましょう。",
 p:"🍗 グリルチキン=80°C/14秒。他の基準と混同しない！"},

{c:"数値ひっかけ",t:true,
 q:"二枚貝（カキ・ハマグリ等）の加熱殺菌基準として正しいものはどれか？",
 o:["63°C/30分（他の魚介類と同じ）","85〜90°C・90秒以上","74°C/15秒","75°C/1分"],
 a:1,e:"二枚貝は85〜90°C/90秒以上が必要です。他の食肉・鮮魚・巻貝（63°C/30分相当）とは別基準です。ノロウイルス対策のための特別基準です。",
 p:"🦪 二枚貝だけ別基準！85〜90°C/90秒　ここは絶対覚える"},

{c:"数値ひっかけ",t:true,
 q:"塩素系サニタイザーの消毒条件として正しいものはどれか？",
 o:["200ppm・1分","200ppm・5分","500ppm・30秒","100ppm・5分"],
 a:1,e:"正解は200ppm・5分浸漬です。100ppmは濃度不足、200ppm/1分は時間不足。濃度と時間の両方を正確に覚えましょう。",
 p:"🧴 200ppm × 5分　濃度も時間も両方正確に！"},

{c:"数値ひっかけ",t:true,
 q:"熱湯（ホットウォーター）による消毒の正しい条件はどれか？",
 o:["77°C（171°F）以上・30秒以上","100°C・5秒以上","60°C以上・30秒以上","90°C以上・60秒以上"],
 a:0,e:"正解は77°C（171°F）以上・30秒以上の浸漬です。60°Cは温度不足、100°C/5秒は時間不足です。",
 p:"🌡 熱湯消毒=77°C/30秒　セットで覚える！"},

{c:"数値ひっかけ",t:true,
 q:"4級アンモニウム（Quaternary Ammonium）の消毒条件として正しいものはどれか？",
 o:["25ppm・10分","200ppm・1分","100ppm・5分","50ppm・30秒"],
 a:3,e:"4級アンモニウムは50ppm・最低30秒です。塩素系（200ppm/5分）と濃度・時間が全く異なるので混同しないよう注意！",
 p:"💧 4級アンモニウム=50ppm/30秒　塩素系200ppm/5分と区別"},

{c:"数値ひっかけ",t:true,
 q:"野菜の消毒（T&H対象外の一般野菜）に使用する塩素濃度と浸漬時間として正しいものはどれか？",
 o:["100ppm・10分","500ppm・1分","50ppm・30分","200ppm・5分"],
 a:3,e:"野菜の消毒も200ppm・5分です。機器の消毒と同じ濃度・時間なのでまとめて覚えましょう。",
 p:"🥬 野菜消毒も機器消毒も同じ 200ppm/5分！"},

{c:"数値ひっかけ",t:true,
 q:"食品を危険温度区域（4〜60°C）に連続して放置してよい最長時間はどれか？",
 o:["1時間以内","2時間以内","4時間以内","30分以内"],
 a:0,e:"コストコの基準では4〜60°Cに連続して存在できる時間は最長でも1時間以内です。「2時間や4時間」という感覚は危険です。",
 p:"⏱ 危険温度区域の連続滞在=最長1時間以内！"},

{c:"数値ひっかけ",t:true,
 q:"受領した温度管理が必要な食品は何分以内に保管庫へ移動させなければならないか？",
 o:["20分以内","60分以内","10分以内","30分以内"],
 a:0,e:"受領後は20分以内に既定の温度帯の保管庫へ移動させなければなりません。「製造後60分以内」と混同しないこと！",
 p:"📦 受領後=20分、製造後=60分　この2つを区別！"},

{c:"数値ひっかけ",t:true,
 q:"製造した温度管理が必要な製品は何分以内にショーケースまたは保管庫に入れなければならないか？",
 o:["30分以内","60分以内","20分以内","2時間以内"],
 a:1,e:"製造後60分以内にショーケースへ陳列または保管庫で管理します。受領後の「20分以内」と数値が違います！",
 p:"🏭 製造後=60分以内。受領後の20分と混同注意！"},

{c:"数値ひっかけ",t:true,
 q:"Food Safety Training Level 1とLevel 2の受講頻度の正しい組み合わせはどれか？",
 o:["Level 1・2ともに3年に1回","Level 1：2年に1回・Level 2：5年に1回","Level 1：1年に1回（全従業員）・Level 2：3年に1回（管理職以上）","Level 1・2ともに毎年"],
 a:2,e:"Level 1は全従業員が1年に1回、Level 2は管理職（管理監督者）が3年に1回受講・合格が必要です。",
 p:"📚 L1=毎年、L2=3年に1回　頻度を確実に区別！"},

{c:"菌の特徴",t:true,
 q:"「芽胞を形成する」細菌の正しい組み合わせはどれか？",
 o:["ボツリヌス菌・ウェルシュ菌・セレウス菌","サルモネラ属菌・カンピロバクター菌・リステリア菌","リステリア菌・大腸菌O-157・カンピロバクター菌","黄色ブドウ球菌・腸炎ビブリオ菌・ノロウイルス"],
 a:0,e:"芽胞形成菌はボツリヌス菌・ウェルシュ菌・セレウス菌の3つ（BOW！と覚える）。サルモネラ・カンピロ・リステリア・黄色ブドウ球菌は形成しません。",

{c:"菌の特徴",t:true,

 a:0,e:"黄色ブドウ球菌はヒトの耳・鼻・喉・毛髪・化膿創に存在します。健康な人でも保菌しているため、手洗い・ヘアネット・傷口への手袋着用が重要です。",

{c:"菌の特徴",t:true,

{c:"菌の特徴",t:false,

 a:2,e:"ボツリヌス菌は視覚異常・複視・嚥下困難・呼吸困難が主症状で致死率2〜20%の重篤な食中毒です。真空パックや缶詰が危険なのはこのためです（偏性嫌気性）。",

{c:"菌の特徴",t:false,

 a:1,e:"腸炎ビブリオ菌は感染型・通性嫌気性・好塩性（海水と同じ3%の塩分を好む）で、生鮮魚介類が主なPHFです。真水で洗うことが予防の一つです。",

{c:"菌の特徴",t:true,

{c:"菌の特徴",t:false,

{c:"菌の特徴",t:true,

{c:"菌の特徴",t:false,

{c:"菌の特徴",t:false,

 p:"🥚 サルモネラ=鶏肉・卵が危険。潜伏6〜72時間"},

{c:"菌の特徴",t:true,

{c:"菌の特徴",t:false,

{c:"菌の特徴",t:false,

 p:"🔍 月次PCR=無症状キャリアを発見するため！"},

{c:"菌の特徴",t:true,
 q:"「通性嫌気性細菌」の正しい説明はどれか？",

 p:"🦠 通性嫌気性=酸素の有無に関わらず増殖。偏性嫌気性と区別！"},

{c:"菌の特徴",t:false,

{c:"菌の特徴",t:false,

 a:0,e:"バイオフィルムはバクテリアが食品接触面・排水管・配管内に形成する粘着性の薄膜です。通常の洗浄・消毒では除去が難しいため、定期的な分解洗浄が必要です。",

{c:"PRPルール",t:false,

 a:1,e:"コードデートラベルは開封後初めての使用完了後に①現物②冷蔵庫の扉③ラック（棚）の3か所全てに貼付します。タイミング・貼付場所の数の両方が試験で問われます（PRP 07条 J）。",
 p:"🏷 コードデートラベル=使用開始後・3か所（現物・扉・ラック）に貼る"},

{c:"PRPルール",t:false,

 a:1,e:"Use By Date Listは冷蔵・冷凍庫内の全製品・原材料・仕掛品の使用期限を一覧で管理するツールです。FIFOの徹底・期限切れの早期発見・廃棄ロス防止が目的です（PRP 07条 K）。",
 p:"📋 Use By Date List=期限一覧でFIFO徹底・廃棄ロス防止"},

{c:"PRPルール",t:true,
 q:"「先入れ先出し（FIFO）」を正しく実施している状態はどれか？",
 o:["日付を気にせず使いやすいものから使う","在庫の多い食品を優先して使用する","古い（期限が近い）食品を手前に・新しい食品を奥に置き、古いものから使用する","新しく入荷した食品を冷蔵庫の手前（取り出しやすい場所）に置く"],

 p:"📦 FIFO=古いものが手前、新しいものが奥。逆にしない！"},

{c:"PRPルール",t:false,

 p:"🧊 冷蔵庫=上段RTE・下段Non-RTE。汁が滴る方向を考えて！"},

{c:"PRPルール",t:false,

 o:["フードセーフティー部門スタッフのみ","全従業員","Food Safety Level 1合格者","Food Safety Training Level 2に合格している管理職以上の職位の者"],

{c:"PRPルール",t:false,

{c:"PRPルール",t:false,

{c:"PRPルール",t:false,
 q:"コストコで使用できる「開梱用ハサミ」の3条件として正しいものはどれか？",

 a:3,e:"開梱用ハサミは①分解可能②洗浄が容易③刃の結合部にネジ等の留め具がない、の3条件全てを満たすものでなければなりません（PRP 08条 D）。",
 p:"✂ ハサミの3条件：分解可・洗浄可・留め具なし"},

{c:"PRPルール",t:false,
 q:"コストコの記録書類に使用するバインダーの素材として正しいものはどれか？",

 a:0,e:"製造場内で使用する記録用バインダーはアルミ製またはステンレス製です。紙・プラスチック・木製は破損時に異物混入リスクがあるため禁止です（PRP 15条 C）。",
 p:"📎 バインダー=アルミまたはステンレス製のみ！"},

{c:"PRPルール",t:true,
 q:"記録書類に使用してはいけない筆記用具として正しいものはどれか？",
 o:["フリクションボールペン・鉛筆・シャープペンシル","赤ペン","永久インクのボールペン","黒の水性ボールペン"],
 a:0,e:"フリクションボールペン・鉛筆・シャープペンシルは消去・改ざんが容易なため使用禁止です。永久インク（Permanent Ink）のボールペンのみ使用可能です（PRP 15条 B）。",
 p:"✒ 記録=永久インクのボールペンのみ！フリクション・鉛筆は禁止"},

{c:"PRPルール",t:false,

 o:["月1回定期実施","製造作業開始前のみ","本社フードセーフティー部門から指示があった際に清掃終了後に実施","毎日全部門で実施"],
 a:2,e:"ATP Swab Testは本社フードセーフティー部門から指示があった際に清掃終了後に実施し、清掃精度を評価します（PRP 10条 W）。",
 p:"🔬 ATPテスト=本社指示時に清掃後実施"},

{c:"PRPルール",t:false,
 q:"フードコートのソフトクリーム検査の実施頻度として正しいものはどれか？",
 o:["毎月1回","6か月に1回","2か月に1回","3か月に1回"],
 a:3,e:"フードコートのソフトクリーム検査は3か月に1回実施します（PRP 10条 X）。「毎月」と「6か月」の間の3か月という数値を正確に押さえましょう。",
 p:"🍦 ソフトクリーム検査=3か月に1回"},

{c:"PRPルール",t:false,
 q:"「健康・服装チェックシート」への記入が免除されるのは誰か？",

 a:0,e:"健康・服装チェックシートへの記入は役職・在籍年数・製造への関与にかかわらず外部業者・訪問者を含む全入室者に義務付けられています（PRP 04条 A）。",
 p:"📋 チェックシート=誰も免除なし！外部業者・訪問者も全員"},

{c:"PRPルール",t:true,
 q:"「製造場内でつけ爪・ネイルアートをしていても手袋を着用すれば問題ない」この記述は正しいか？",
 o:["誤り。短い爪なら許可される","正しい。手袋で覆えば衛生的","誤り。つけ爪・ネイルアート・マニキュアは手袋の有無にかかわらず製造場内では一切禁止","正しい。管理職の許可があれば可"],
 a:2,e:"つけ爪・ネイルアート・マニキュアは手袋の着用有無にかかわらず製造場内では一切禁止です。爪自体も短く切り清潔に保つ必要があります（PRP 04条 D）。",
 p:"💅 つけ爪・ネイル=手袋をしても禁止！"},

{c:"PRPルール",t:false,
 q:"製造場内での水分補給に関して正しいものはどれか？",
 o:["製造場の外でのみ飲用可能（場所の制限なし）","市販の飲料水なら持ち込み可","各フレッシュ部門から支給された水のみ製造場内で飲用可能。私物の飲料は禁止","水分補給は禁止"],
 a:2,e:"製造場内での飲食は禁止ですが、各フレッシュ部門から支給された水のみが例外として飲用可能です。市販の飲料・私物のペットボトル等は禁止です（PRP 04条 M）。",
 p:"💧 製造場内の飲み物=部門支給の水のみ！私物飲料は禁止"},

{c:"PRPルール",t:false,
 q:"コストコで使用できるエプロンのD88フードコートでの色分けルールとして正しいものはどれか？",
 o:["全て白エプロン","部門に関係なく全て同じ色","白=調理中・黄=清掃時・濃紺=生プルコギビーフ取り扱い時","青=調理中・赤=清掃時・白=生肉取り扱い時"],
 a:2,e:"D88フードコートのエプロン：白（調理中）・黄（清掃・サニテーション作業時）・濃紺（生プルコギビーフ取り扱い時）の3色を使い分けます（PRP 04条 H）。",
 p:"👕 D88エプロン：白=調理、黄=清掃、濃紺=生プルコギ"},

{c:"PRPルール",t:false,
 q:"「非食品（洗浄剤・殺虫剤等）」の正しい保管場所はどれか？",
 o:["食品の近くに保管して作業効率を上げる","食品・食品接触面・包装資材から完全に離れた専用の指定場所に施錠して保管する","冷蔵庫内に一緒に保管してよい","従業員休憩室に保管してよい"],
 a:1,e:"非食品（洗浄剤・殺虫剤・化学薬品等）は食品・食品接触面・包装資材から完全に離れた専用の指定場所に施錠して保管しなければなりません（PRP 07条 O）。",
 p:"🔒 化学薬品=食品から離れた施錠場所に保管！"},

{c:"PRPルール",t:false,
 q:"「スペックシート（製品仕様書・レシピ）」の作成権限について正しいものはどれか？",
 o:["各倉庫店のフレッシュフーズマネージャーが作成できる","外部のコンサルタントが作成する","本社の購買部またはフードセーフティー部門が作成する。倉庫店独自のレシピでの製造は禁止","各部門のシフトリーダーが作成できる"],
 a:2,e:"スペックシートは本社（購買部またはフードセーフティー部門）が作成します。倉庫店独自のレシピで製造することは食品安全上の管理が保証できないため禁止です（PRP 08条 E）。",
 p:"🏢 レシピ（スペックシート）=本社管轄。倉庫店独自変更は禁止！"},

{c:"PRPルール",t:false,
 q:"腸内細菌検査が「陽性または擬陽性」だった場合と「最終的に陰性」だった場合の対応の違いとして正しいものはどれか？",
 o:["陽性・擬陽性でも通常業務を続けてよい","陰性でも1週間の業務制限が必要","陽性・擬陽性→食品取扱業務を直ちに制限、最終陰性→食品取扱業務への復帰が可能","どちらの場合も同じ対応"],
 a:2,e:"擬陽性・陽性→プレップルーム等での食品取扱業務を即時制限。最終陰性→食品取扱業務への復帰が可能です（PRP 03条 K）。",
 p:"🧫 擬陽性→即制限、最終陰性→復帰可能。2段階の対応！"},

{c:"PRPルール",t:false,
 q:"防虫防鼠プログラムの委託業者として正しいものはどれか？",

 a:3,e:"コストコの防虫防鼠プログラムはイカリ消毒株式会社に委託されています（PRP 12条 A）。月次施工報告書の保管も義務付けられています。",
 p:"🐛 防虫防鼠=イカリ消毒株式会社に委託"},

{c:"PRPルール",t:false,
 q:"水質検査の正しい実施頻度はどれか？",

 a:0,e:"水質検査は年1回外部検査機関に依頼して実施します。コストコでは安全性向上のため年2回の実施を推奨しています（PRP 14条 B）。",
 p:"💧 水質検査=年1回（推奨は年2回）"},

{c:"PRPルール",t:false,

 p:"📧 フードセーフティー部門=foodsafety-jp@costco.co.jp"},

{c:"PRPルール",t:false,

 p:"💡 UV灯交換=6か月に1回"},

{c:"HACCP",t:false,
 q:"HACCPの7原則を正しい順番で示しているものはどれか？",
 o:["①モニタリング→②CL設定→③CCP決定→④危害分析→⑤文書化→⑥検証→⑦改善措置","①文書化→②検証→③改善措置→④モニタリング→⑤CL設定→⑥CCP決定→⑦危害分析","①CCP決定→②危害分析→③モニタリング→④CL設定→⑤検証→⑥改善措置→⑦文書化","①危害分析→②CCP決定→③CL設定→④モニタリング→⑤改善措置→⑥検証→⑦文書化・記録保管"],

 p:"📐 7原則：危→CCP→CL→モニ→改善→検証→文書"},

{c:"HACCP",t:false,

 o:["記録管理のみ","HACCPプランを実施するための準備段階（チーム編成・製品説明書・使用方法確認・工程図作成・現場確認）","検証作業のみ","7原則の実施"],
 a:1,e:"手順1〜5（チーム編成→製品説明書→使用方法確認→工程図作成→現場確認）はHACCP7原則（手順6〜12）を実施するための準備段階です。",
 p:"📋 手順1〜5=準備段階・手順6〜12=7原則の実施"},

{c:"HACCP",t:false,
 q:"「重要管理点（CCP）」の定義として正しいものはどれか？",
 o:["全ての製造工程","HACCPチームが任意に選んだ工程","検証が不可能な工程","食品安全上の危害を予防・除去・許容できるレベルまで低減するために管理が不可欠な工程または手順"],
 a:3,e:"CCPとは食品安全上の危害を予防・除去・許容できるレベルまで低減するために管理が不可欠な工程または手順です（手順7・原則2）。",
 p:"🎯 CCP=危害を制御する不可欠な工程。定義を正確に覚える"},

{c:"HACCP",t:false,

 a:0,e:"CLを逸脱した場合はあらかじめ定めた改善措置（Corrective Action）を実施し、内容を文書化しなければなりません（手順10・原則5）。",
 p:"📝 CL逸脱=改善措置の実施＋記録。隠蔽は絶対NG"},

{c:"HACCP",t:false,
 q:"「モニタリング（Monitoring）」と「検証（Verification）」の違いとして正しいものはどれか？",
 o:["検証は日々の作業・モニタリングは年1回の作業","モニタリング=日々の製造でCLが守られているかを確認・記録する作業（原則4）、検証=HACCPプラン全体が機能しているかを定期的に確認する作業（原則6）","どちらも記録不要","どちらも同じ作業"],
 a:1,e:"モニタリング（原則4）は日々のCL確認・記録。検証（原則6）はHACCPプラン全体が計画通りに機能しているかの定期的な上位確認です。",
 p:"🔍 モニタリング=日々のCL確認、検証=プラン全体の機能確認"},

{c:"HACCP",t:false,
 q:"「PRPがHACCPの前提条件」とされる理由として正しいものはどれか？",
 o:["PRPはHACCPより重要だから","PRPがなくてもHACCPは単独で機能するから","PRPはHACCPの代替として機能するから","PRPが適切に実施されていることを前提としてHACCPが有効に機能するため。PRPなしにHACCPは機能しない"],
 a:3,e:"PRPという土台（手洗い・温度管理・清掃消毒等）の上でHACCPが機能します。「PRP（土台）→HACCP（建物）」という二層構造です（Level 2テキスト 11.2）。",
 p:"🏗 PRP（土台）の上にHACCP（建物）。土台なければ建物倒れる"},

{c:"HACCP",t:false,

{c:"HACCP",t:false,
 q:"GFSIとはどのような機関か？",

 a:0,e:"GFSIは世界食品安全イニシアチブ（Global Food Safety Initiative）で、食品安全管理システムの認証スキーム（FSSC22000・BRC等）を評価・承認する国際組織です（PRP 06条 B）。",

{c:"HACCP",t:false,
 q:"「リコール（Recall）」と「製品回収（Withdrawal）」の違いとして正しいものはどれか？",

 p:"🔄 リコール=消費者から回収、製品回収=流通段階で引き揚げ"},

{c:"HACCP",t:false,
 q:"リコールの実施を決定する権限は誰にあるか？",

{c:"HACCP",t:false,

 o:["従業員への内部通知のみ","SNSのみ","店頭の掲示板のみ","コストコジャパンのホームページ（ウェブサイト）上で公開する"],

{c:"HACCP",t:false,

{c:"HACCP",t:false,
 q:"食品安全上の「多層防御（Defense in Depth）」の考え方として正しいものはどれか？",

{c:"HACCP",t:false,
 q:"食中毒予防の「三原則」として正しいものはどれか？",
 o:["つけない（汚染防止）・増やさない（温度管理）・やっつける（加熱殺菌）","見る・嗅ぐ・捨てる","冷やす・加熱する・乾燥させる","洗う・消毒する・包装する"],
 a:0,e:"食中毒予防の三原則は「つけない（手洗い・交差汚染防止）」「増やさない（適切な温度管理）」「やっつける（十分な加熱）」です。これは食品安全の根幹概念です。",
 p:"🎯 三原則：つけない・増やさない・やっつける"},

{c:"HACCP",t:false,
 q:"「食品安全文化」の説明として最も正確なものはどれか？",
 o:["組織全体が食品安全を最優先とする価値観・行動・信念を共有し、検査がなくても自発的に正しい行動をとる状態","特定の従業員だけが食品安全を意識すればよい","マニュアルを整備すれば自然に醸成される","罰則によって強制的に維持されるもの"],
 a:0,e:"食品安全文化とは組織全体が食品安全を最優先とする価値観・行動・信念を共有し、検査・監査・罰則がなくても日常業務で自発的に安全行動をとる状態です。",
 p:"🌟 食品安全文化=誰も見ていなくても全員が正しく動く組織"},

{c:"総仕上げ",t:false,
 q:"「食品安全の最後の砦」と呼ばれる役割を担うのはどれか？",
 o:["農家・生産者","消費者","小売業（コストコ等）","政府機関・保健所"],
 a:2,e:"小売業は生産→加工→流通→消費というフードチェーンの最終段階として、消費者に届く前に食品安全上の危害を制御・排除する「最後の砦」の役割を担っています（Level 2テキスト）。",
 p:"🏰 小売=フードチェーンの最後の砦。責任は最も重い"},

{c:"総仕上げ",t:true,
 q:"「食品の見た目・臭い・色が正常であれば食中毒を起こす危険はない」この記述は正しいか？",
 o:["正しい。見た目で判断できる","誤り。変色した食品のみ危険","誤り。病原性バクテリアは見た目・臭い・色を変えずに増殖する。正常に見える食品でも食中毒を起こす危険がある","正しい。腐敗臭がすれば危険"],
 a:2,e:"腐敗性バクテリアは食品を変色・異臭化しますが、サルモネラ・カンピロバクター等の病原性バクテリアは臭い・外観を変えずに増殖します。「正常に見える＝安全」は危険な思い込みです。",
 p:"👁 見た目正常=食中毒あり得る！これが食品安全の核心"},

{c:"総仕上げ",t:true,
 q:"「手袋を着用していれば手洗いは不要」この記述は正しいか？",
 o:["正しい。手袋が手洗いの代わりになる","誤り。手袋は食品取り扱いには必要なく手洗いのみでよい","正しい。使い捨て手袋は完全な汚染防止ができる","誤り。手袋を着用する前にも手洗いが必要。手袋は手洗いの補助的なツール"],
 a:3,e:"手袋は手洗いの代替ではありません。手袋着用前にも必ず手洗いが必要です。手袋の外側も汚染されることがあり、定期的な交換と手洗いの組み合わせが必要です（PRP 02条）。",
 p:"🖐 手袋=手洗いの代替ではない！着用前にも手洗いを"},

{c:"総仕上げ",t:false,
 q:"食中毒事故が組織に与える影響として最も包括的なものはどれか？",
 o:["製品のリコール費用のみ","評判が少し落ちるだけ","仕入れ先の変更だけで済む","刑事責任・民事賠償・ブランド信頼の失墜・営業停止・事業閉鎖の可能性まで含む多面的なダメージ"],
 a:3,e:"食品安全事故は①消費者への健康被害②刑事責任③民事損害賠償④ブランド・信用失墜⑤営業停止⑥事業閉鎖まで引き起こしうる多面的・致命的なリスクです（Level 2テキスト 2章）。",
 p:"⚠ 食中毒1件=刑事＋民事＋信用＋営業停止のすべて"},

{c:"総仕上げ",t:false,
 q:"次の行動のうち「食品安全文化」が最もよく体現されているものはどれか？",
 o:["検査がなくても・誰も見ていなくても消費者の安全を守るために自発的に正しい行動をとる","罰則があるから期限切れ食品を廃棄する","検査官が来るときだけ正しい手洗いをする","マニュアルに書いてあるから手袋をする"],
 a:0,e:"真の食品安全文化は「見られているから」「罰則があるから」ではなく「消費者の安全を守ることが自分の使命だから」という内発的動機に基づいた行動です。",
 p:"🌟 「誰も見ていなくても正しく動く」=食品安全文化の完成形"},

{c:"総仕上げ",t:false,
 q:"「交差汚染（Cross-contamination）」の正しい説明はどれか？",
 o:["化学物質が食品に混入すること","食品が腐敗すること","食品同士の味が混ざること","病原性微生物・アレルゲン等が手・器具・調理台などを介して別の食品に移ること"],
 a:3,e:"交差汚染は病原性微生物・アレルゲン等が手・器具・調理台・包装材などを介して別の食品に移ることです。二次汚染とも呼ばれ、RTE食品への二次汚染が特に危険です。",
 p:"⚠ 交差汚染=生食品→器具→RTE食品というルートが最も危険"},

{c:"総仕上げ",t:false,
 q:"「PHF（潜在的に危険な食品）」と「RTE（そのまま食べられる食品）」の関係として正しいものはどれか？",
 o:["PHFとRTEは全く別の概念","PHFはすべてRTEである","RTE食品の多くはPHFでもある。RTE×PHFの組み合わせが最も危険（加熱という制御ステップなしに消費されるため）","RTEはPHFではない"],
 a:2,e:"加熱済みデリ食品・カットフルーツ等のRTE食品の多くはPHFでもあります。喫食前の加熱殺菌がないため、二次汚染が食中毒に直結します（RTE×PHF=最大リスク）。",
 p:"⚡ RTE×PHF=最も危険な組み合わせ！二次汚染が直接食中毒に"},

{c:"総仕上げ",t:false,
 q:"「アレルゲンの特定原材料（義務表示8品目）」として正しいセットはどれか？",
 o:["卵・乳・米・そば・落花生・えび・かに・くるみ","卵・乳・小麦・そば・落花生・えび・かに・くるみ","卵・乳・小麦・そば・落花生・えび・いか・くるみ","卵・乳・小麦・そば・落花生・えび・かに・アーモンド"],
 a:1,e:"特定原材料の義務表示8品目は「卵・乳・小麦・そば・落花生・えび・かに・くるみ」です（2023年3月にくるみが追加）。アーモンド・いかは準ずる品目（推奨表示）です。",
 p:"🥚 義務8品目：卵・乳・小麦・そば・落花生・えび・かに・くるみ"},

{c:"総仕上げ",t:false,
 q:"「食品安全の責任は誰にあるか？」という問いへの正しい答えはどれか？",
 o:["フードセーフティー部門のみが責任を持つ","管理職のみが責任を持つ","管理職から現場スタッフまで食品取扱業務に関わる全員が責任を共有する","サプライヤーにある"],
 a:2,e:"食品安全の責任は管理職から現場スタッフまで全員が共有します。「自分には関係ない」という考えが食中毒を引き起こす主要原因の一つです。これが食品安全文化の前提です。",
 p:"🤝 食品安全=全員の責任！一人の例外も許されない"},

{c:"総仕上げ",t:false,
 q:"冷蔵庫の温度が規定値（4°C）を超えていることに気づいた従業員の正しい初動対応はどれか？",
 o:["冷蔵庫の電源を切り再起動すれば問題ない","そのまま作業を継続し夜に報告する","温度を記録し管理職に即報告・食品の状態確認・原因調査・必要に応じて別庫への移動または廃棄を行う","温度計を交換してもう一度測定するだけでよい"],
 a:2,e:"冷蔵庫温度の逸脱（4°C超）は温度記録→管理職への即報告→食品の安全確認→原因調査→必要に応じた廃棄または別庫への移動が正しい対応順序です。",
 p:"🌡 温度逸脱発見=記録→即報告→食品確認→原因調査の順"},

{c:"総仕上げ",t:false,
 q:"「食品安全トレーニングの最終目的」として最も適切なものはどれか？",
 o:["上司の指示を正確に覚えること","食品取扱者が正しい知識・行動を持ち日々の業務で自発的に食品安全を実践できるようになること","知識の習得だけが目的","試験に合格することが最終目標"],
 a:1,e:"食品安全トレーニングの最終目的は試験合格ではなく、日々の業務で食品取扱者が自発的・継続的に安全な行動をとれるようになることです。知識が行動に変わって初めて成功です。",
 p:"🎯 トレーニングの真の目的=知識を日々の行動に変えること"},

{c:"総仕上げ",t:false,
 q:"「食品安全はコストではなく投資」という考えを正確に説明しているものはどれか？",
 o:["食品安全に費用をかけるほど損失になる","食品安全への投資（教育・設備・管理）はリコール・訴訟・ブランド損失の回避につながり長期的に事業の継続と成長を支える","食品安全は規制対応だけのコスト","食品安全は最小限のコストで対応すべき"],
 a:1,e:"食品安全への投資はリコール費用・法的責任・ブランド損失・営業停止というリスクを回避し、事業の継続と成長を支えます。「食品安全は稼ぎ続けるための基盤」です。",
 p:"💰 食品安全への投資=将来の大損失を防ぐ最善の経営判断"},

{c:"総仕上げ",t:false,
 q:"「衛生的な手洗い」が完了したとみなせる状態として正しいものはどれか？",
 o:["アルコールを手に塗っただけ","非接触式タイマーで30秒間ハンドソープで洗い・流水ですすぎ・ペーパータオルで乾燥させた状態","水で30秒流しただけ","手袋を着用した状態"],
 a:1,e:"正しい手洗いは①流温水で濡らす②ハンドソープをつけ非接触式タイマーで30秒間洗う③十分に流水ですすぐ④ペーパータオルで乾燥させる、の全ステップが必要です（PRP 02条 C）。",
 p:"🙌 手洗い4ステップ：濡らす→30秒洗う→すすぐ→ペーパー乾燥"},

{c:"総仕上げ",t:true,
 q:"「消毒液は一度作れば何日でも使い回してよい」この記述は正しいか？",
 o:["正しい。容器に保管すれば問題ない","誤り。1日2回交換が必要","誤り。消毒液は食品残渣の混入・濃度低下で効果が失われるため、毎日または汚染が確認された時点で交換が必要","正しい。密封すれば1週間有効"],
 a:2,e:"消毒液（サニタイザー）は使用により濃度が低下し、食品残渣・油脂の混入で効果が失われます。毎日または汚染が確認された時点で交換しなければなりません（PRP 10条 H）。",
 p:"🧴 消毒液=毎日交換！食品残渣が入ったら即交換"},

{c:"総仕上げ",t:true,
 q:"「賞味期限内であれば保管温度に関わらず安全である」この記述は正しいか？",
 o:["正しい。表示された期限が絶対の基準","誤り。賞味期限は適切な保管条件が守られた場合に有効な期限。温度管理を怠れば期限内でも食中毒リスクが生じる","正しい。賞味期限が全てを保証する","誤り。賞味期限は参考程度で無視してよい"],
 a:1,e:"賞味期限は適切な保管条件（規定の温度・湿度等）が守られた場合に有効な期限です。温度管理を怠れば賞味期限内でも細菌増殖による食中毒リスクが高まります。",
 p:"📅 賞味期限=条件付きの期限。温度管理を怠れば無意味！"},

{c:"総仕上げ",t:false,
 q:"「食品安全上の問題を発見した従業員がとるべき行動」として正しいものはどれか？",
 o:["見なかったことにする","自分で解決しようとして隠す","直ちに管理職（上司）に報告し指示を仰ぐ","SNSに投稿して世間に知らせる"],
 a:2,e:"食品安全上の問題（温度逸脱・異物発見・衛生基準違反等）を発見した従業員は直ちに管理職に報告し指示を仰ぐことが必要です。隠蔽は食品安全文化の崩壊につながります。",
 p:"📣 問題発見→即報告！隠蔽・放置は食品安全文化の崩壊"},

{c:"総仕上げ",t:false,
 q:"コストコの食品安全プログラムの最終的なゴールとして最も適切なものはどれか？",
 o:["コストを最小化すること","書類を完璧に整備すること","監査で合格点を取ること","メンバー（お客様）と従業員を食品由来の危害から守り安全で高品質な食品を提供し続けること"],
 a:3,e:"コストコの食品安全プログラムの最終目標はメンバー（お客様）と従業員を食品由来の危害から守り、安全で高品質な食品を提供し続けることです。書類整備や監査合格はそのための手段です。",
 p:"🌟 最終ゴール=お客様と従業員を守り続けること。それが全ての出発点"},

{c:"総仕上げ",t:false,
 q:"「FIFOを徹底する理由」として正しいものはどれか？",
 o:["新しい食品を先に使うため","コスト削減のみを目的とする","古い在庫を優先して使用することで期限切れによる廃棄ロスを防ぎ品質・安全性を確保するため","在庫数の把握を容易にするため"],
 a:2,e:"FIFOは古い（賞味期限・消費期限が近い）食品を優先して使用することで、期限切れ・廃棄ロスの防止と品質・安全性の確保を同時に達成する管理手法です（PRP 07条 E）。",
 p:"📦 FIFOの目的=廃棄ロス防止＋品質・安全性確保"},

{c:"総仕上げ",t:false,
 q:"「食品接触面の清掃手順」の正しい順番はどれか？",
 o:["大まかな汚れ除去→洗剤で洗う→流水ですすぐ→消毒（サニタイザー）→自然乾燥（空気乾燥）","洗浄→消毒→すすぎ→乾燥","すすぎ→消毒→洗浄→乾燥","消毒→洗浄→すすぎ→乾燥"],
 a:0,e:"正しい清掃の5段階：①大まかな汚れ除去②洗剤で洗う③流水ですすぐ④消毒（サニタイザー）⑤自然乾燥（空気乾燥）。消毒の前に必ずすすぐことと、最後は布拭きではなく空気乾燥させることがポイントです（PRP 10条）。",
 p:"🧽 清掃5段階：汚れ除去→洗剤→すすぎ→消毒→空気乾燥"},

{c:"総仕上げ",t:false,
 q:"「ゾーニング（区域分け）が食品安全に重要な理由」として最も正確なものはどれか？",
 o:["作業スペースを広くするため","清掃を効率化するため","汚染リスクの高いエリアと低いエリアを物理的に分けることで交差汚染の発生確率を根本的に最小化するため","法律上の義務のみ"],
 a:2,e:"ゾーニングはNon-RTE食品（生食品）とRTE食品（加熱済み・そのまま食べられる食品）の作業エリアを物理的に分けることで交差汚染を構造的に防ぐための最も根本的な対策です（PRP 07条 D）。",
 p:"🗺 ゾーニング=交差汚染を構造的に防ぐ最強の武器"},

{c:"総仕上げ",t:false,
 q:"「食品安全と経営の関係」について最も正確に説明しているものはどれか？",
 o:["食品安全への投資は長期的にブランド価値・顧客信頼・事業継続性を高め、経営の持続的成長を支える","食品安全は売上を下げる要因","食品安全対策は利益を圧迫するだけ","食品安全は法規制への対応だけが目的"],
 a:0,e:"食品安全への継続的な投資はブランド価値の維持・顧客からの信頼獲得・リコールや訴訟コストの回避を通じて、長期的な経営の持続的成長を支えます。食品安全は「守り」であり「攻め」でもあります。",
 p:"💼 食品安全=守りながら稼ぐ。ブランドと信頼の基盤"},

{c:"総仕上げ",t:false,
 q:"Vol.1〜Vol.5の500問に真剣に取り組んだあなたへ。Level 2合格のための最重要ポイント5つとして正しいものはどれか？",
 o:["①エプロン色②バインダー素材③UV灯交換④ソフトクリーム検査⑤水質検査","①危険温度区域(4〜60°C)②主要加熱基準（種類別の温度・時間）③消毒条件（200ppm/5分等）④HACCP7原則の順序⑤PRPとHACCPの関係（土台と建物）","①売上データ②在庫管理③シフト作成④採用基準⑤コスト管理","①ゴミ管理②防虫③水質④施設管理⑤記録保管"],
 a:1,e:"①危険温度区域（4〜60°C）②加熱基準（グリル80°C/14秒・ロティサリー胸84°C/もも77°C・二枚貝85〜90°C/90秒等）③消毒条件（塩素200ppm/5分・熱湯77°C/30秒等）④HACCP7原則の順序⑤PRPとHACCPの二層構造。この5点を完璧に押さえれば合格は確実です！22年の経験と判断力があなたの最大の武器です。",
 p:"🏆 5核心：温度区域・加熱基準・消毒条件・HACCP7原則・PRP関係。あとはあなたの経験が武器！"},


{c:"総仕上げ",t:false,
 q:"「洗浄（Cleaning）」と「消毒（Sanitizing）」の正しい違いと順序はどれか？",
 o:["消毒してから洗浄するのが正しい順序","どちらか一方だけすれば十分","洗浄=汚れ・残渣の除去、消毒=病原微生物を安全なレベルまで低減。順序は必ず洗浄→すすぎ→消毒","どちらも同じ作業"],
 a:2,e:"洗浄は汚れ・油脂・残渣を除去する作業。消毒は病原微生物を低減する作業。順序は必ず「洗浄→すすぎ→消毒→空気乾燥」です。汚れが残っていると消毒効果が大幅に低下します（PRP 10条）。",
 p:"📋 洗浄→消毒 の順番は絶対に逆にしない！"},

{c:"総仕上げ",t:false,
 q:"コストコの食品安全プログラムにおいて、管理監督者（AGM・マネージャー等）が毎日行うべき最重要業務の組み合わせとして正しいものはどれか？",
 o:["シフト作成のみ","在庫管理のみ","売上データの分析のみ","食品安全基準の遵守確認・従業員への食品安全教育・問題発生時の迅速な対応・記録の適切な管理"],
 a:3,e:"管理監督者の食品安全上の日々の最重要業務は①基準の遵守確認②従業員教育③問題発生時の迅速な対応④記録の適切な管理です。デイリーインスペクション・チェックシート・CCP記録管理などに具体化されています。",
 p:"👩‍💼 管理職の日々の使命=確認・教育・対応・記録の4つ"},


];
let cur=0,ans=new Array(Q.length).fill(null),done=new Array(Q.length).fill(false);
const L=['A','B','C','D','E'];
function start(){document.getElementById('start').style.display='none';document.getElementById('quiz').style.display='block';load(0);}
function load(i){
  cur=i;const q=Q[i],tot=Q.length;
  document.getElementById('qn').textContent=`問題 ${i+1} / ${tot}`;
  document.getElementById('qcat').textContent=q.c;
  document.getElementById('qt').textContent=q.q;
  document.getElementById('pt').textContent=`${i+1} / ${tot}`;
  document.getElementById('pbi').style.width=((i+1)/tot*100)+'%';
  const tr=document.getElementById('trap');tr.className=q.t?'trap on':'trap';
  const o=document.getElementById('opts');o.innerHTML='';
  q.o.forEach((opt,j)=>{
    const d=document.createElement('div');d.className='opt';
    d.innerHTML=`<span class="ol">${L[j]}</span><span>${opt}</span>`;
    d.onclick=()=>pick(j);o.appendChild(d);
  });
  const e=document.getElementById('exp');e.style.display='none';e.className='exp';
  if(done[i])show(ans[i],q.a,q.e,q.p);
  document.getElementById('pb').disabled=i===0;
  const last=i===tot-1;
  document.getElementById('nb').style.display=last?'none':'inline-block';
  document.getElementById('sub').style.display=last?'inline-block':'none';
}
function pick(j){
  if(done[cur])return;
  ans[cur]=j;done[cur]=true;
  show(j,Q[cur].a,Q[cur].e,Q[cur].p);
}
function show(sel,cor,et,pt){
  const os=document.querySelectorAll('.opt');
  os.forEach(o=>o.classList.add('dis'));
  os[cor].classList.add('cor');
  if(sel!==cor)os[sel].classList.add('wrg');else os[sel].classList.add('cor');
  const e=document.getElementById('exp');e.style.display='block';
  const ok=sel===cor;e.className='exp'+(ok?'':' we');
  e.innerHTML=`<div class="et">${ok?'✓ 正解！':'✗ 不正解'}</div>${et}`+(pt?`<div class="ep">${pt}</div>`:'');
}
function next(){if(cur<Q.length-1)load(cur+1);}
function prev(){if(cur>0)load(cur-1);}
function submit(){
  const tot=Q.length;let c=0,u=0;
  Q.forEach((q,i)=>{if(ans[i]===null)u++;else if(ans[i]===q.a)c++;});
  const w=tot-c-u,sc=Math.round(c/tot*100);
  document.getElementById('quiz').style.display='none';
  document.getElementById('result').style.display='block';
  document.getElementById('pbi').style.width='100%';
  document.getElementById('pt').textContent=`${tot} / ${tot}`;
  document.getElementById('sp').textContent=sc;
  document.getElementById('rc').textContent=c;
  document.getElementById('rw').textContent=w;
  document.getElementById('ru').textContent=u;
  const p=sc>=85;
  document.getElementById('rtt').textContent=p?'合格 PASS':'不合格 FAIL';
  document.getElementById('rtt').style.color=p?'var(--correct)':'var(--wrong)';
  document.getElementById('rm').textContent=p?`🎉 合格ライン（85点）突破！\n正解率 ${sc}% — 本番も大丈夫！`:`合格まであと${85-sc}点。\n解説の💡ポイントを確認して再チャレンジ！`;
  setTimeout(()=>{const a=document.getElementById('arc');a.style.transition='stroke-dashoffset 1.5s ease';a.style.strokeDashoffset=534-(sc/100)*534;a.style.stroke=p?'var(--correct)':'var(--wrong)';},100);
}
function review(){
  const s=document.getElementById('rvs');
  s.style.display=s.style.display==='none'?'block':'none';
  if(s.innerHTML.trim()!==''&&s.style.display==='none')return;
  let h='<div class="rvt">解答レビュー — 全問</div>';
  Q.forEach((q,i)=>{
    const ok=ans[i]===q.a,cl=ok?'rc':'rw';
    const at=ans[i]===null?'未回答':`${L[ans[i]]}. ${q.o[ans[i]]}`;
    const pp=q.p?`<div style="margin-top:6px;padding:6px 10px;background:rgba(251,191,36,.08);border-left:3px solid var(--gold);border-radius:4px;font-size:.78rem;color:var(--gold)">${q.p}</div>`:'';
    h+=`<div class="rvi ${cl}"><div style="font-size:.72rem;margin-bottom:7px;color:var(--accent);font-family:'Syne',sans-serif">${i+1}問目 — ${q.c}${q.t?' ⚠':''}</div><div class="rvq">${q.q}</div><div><div class="ral">あなたの回答</div><div class="${ok?'rac':'raw'}" style="font-size:.85rem">${at}</div>${!ok?`<div class="ral" style="margin-top:7px">正解</div><div class="rac" style="font-size:.85rem">${L[q.a]}. ${q.o[q.a]}</div>`:''}<div class="ral" style="margin-top:7px">解説</div><div style="opacity:.8;font-size:.82rem;line-height:1.7">${q.e}</div>${pp}</div></div>`;
  });
  s.innerHTML=h;
}
function retry(){
  ans=new Array(Q.length).fill(null);done=new Array(Q.length).fill(false);
  document.getElementById('result').style.display='none';
  document.getElementById('arc').style.strokeDashoffset=534;
  document.getElementById('rvs').style.display='none';document.getElementById('rvs').innerHTML='';
  document.getElementById('quiz').style.display='block';
  document.getElementById('pbi').style.width='1%';load(0);
}
</script>
</body>
</html>
